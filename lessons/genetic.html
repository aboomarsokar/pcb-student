<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المادة الوراثية</title>
<base href="../"><script src="lib/bg.js"></script><script src="lib/icons.js"></script><script src="lib/voice.js"></script>
<style>
@font-face{font-family:"PCB Naskh";font-style:normal;font-weight:400 700;font-display:swap;src:url("fonts/naskh-arabic.woff2") format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:"PCB Naskh";font-style:normal;font-weight:400 700;font-display:swap;src:url("fonts/naskh-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--ink:#2A2016;--muted:#5C4B38;--bg:#EFE3CC;--card:#FBF5E8;--accent:#1565C0;--accent-ink:#fff;--soft:#E6D3AE;--line:#C9B28C;--ok:#2E7D32;--bad:#D32F2F;--r:18px;--edge:rgba(0,0,0,.28);--sh:rgba(20,40,30,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F6EEE2;--muted:#E6D3B8;--bg:#5A4636;--card:#6A5442;--soft:#7A624C;--line:#8A7058;--ok:#66BB6A;--bad:#EF5350;--accent-ink:#0b1f17;--edge:rgba(0,0,0,.5);--sh:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--ink:#F6EEE2;--muted:#E6D3B8;--bg:#5A4636;--card:#6A5442;--soft:#7A624C;--line:#8A7058;--ok:#66BB6A;--bad:#EF5350;--accent-ink:#0b1f17;--edge:rgba(0,0,0,.5);--sh:rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0}
body{-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-family:"PCB Naskh","Noto Naskh Arabic","Amiri",system-ui,sans-serif;font-weight:600;font-size:18px;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
body[data-topic]{--accent:var(--acc-raw);--soft:color-mix(in srgb,var(--acc-raw) 14%,var(--card));--line:color-mix(in srgb,var(--acc-raw) 30%,var(--card));background:linear-gradient(180deg,var(--soft),var(--bg) 340px)}
:root[data-theme="dark"] body[data-topic]{--accent:color-mix(in srgb,var(--acc-raw) 58%,#fff)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-topic]{--accent:color-mix(in srgb,var(--acc-raw) 58%,#fff)}}
header{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:800;min-width:0;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html,body{max-width:100%;overflow-x:hidden}
main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:12px 12px 24px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;transition:transform .15s,background .2s}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn-main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.btn-ghost{background:transparent}
.hidden{display:none!important}
.hint{color:var(--muted);margin:4px 0 14px}
.sp{width:8px;display:inline-block}

/* clouds */
.sky{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-top:6px}
@media (min-width:640px){.sky{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}}
.cloud{position:relative;border:0;background:none;padding:0 0 4% 0;border-radius:0;aspect-ratio:300/180;background-size:100% 100%;background-repeat:no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#1f2a33;font-weight:800;font-size:17px;line-height:1.3}
.cloud:hover{transform:translateY(-3px)}
.cloud .ico{font-size:26px;margin-bottom:2px}
.cloud .nm{padding:0 14%;margin-top:8px;white-space:normal;min-width:0}
.cloud small{display:block;font-weight:500;font-size:13px;opacity:.85;margin-top:0;padding-bottom:6%}
.cloud.done::after{content:"✓";position:absolute;top:10%;left:14%;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--ok);font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.cloud.leaving{opacity:0;transform:scale(.92);transition:opacity .75s,transform .75s}

.c4{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 180%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 gradientUnits=%22userSpaceOnUse%22 x1=%220%22 y1=%2240%22 x2=%220%22 y2=%22165%22%3E%3Cstop offset=%220%22 stop-color=%22%23cfe6fb%22/%3E%3Cstop offset=%22.5%22 stop-color=%22%238cc4ee%22/%3E%3Cstop offset=%221%22 stop-color=%22%233f7fb8%22/%3E%3C/linearGradient%3E%3Cfilter id=%22s%22 x=%22-10%25%22 y=%22-20%25%22 width=%22120%25%22 height=%22150%25%22%3E%3CfeGaussianBlur stdDeviation=%221.6%22/%3E%3C/filter%3E%3C/defs%3E%3Cg filter=%22url%28%23s%29%22 fill=%22url%28%23g%29%22%3E%3Ccircle cx=%2266%22 cy=%22120%22 r=%2232%22/%3E%3Ccircle cx=%22108%22 cy=%2294%22 r=%2244%22/%3E%3Ccircle cx=%22164%22 cy=%2274%22 r=%2254%22/%3E%3Ccircle cx=%22222%22 cy=%2296%22 r=%2244%22/%3E%3Ccircle cx=%22256%22 cy=%22120%22 r=%2228%22/%3E%3Crect x=%2244%22 y=%22110%22 width=%22228%22 height=%2246%22 rx=%2223%22/%3E%3C/g%3E%3Cellipse cx=%22150%22 cy=%2262%22 rx=%2258%22 ry=%2214%22 fill=%22%23fff%22 opacity=%22.55%22/%3E%3C/svg%3E")}.c5{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 180%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 gradientUnits=%22userSpaceOnUse%22 x1=%220%22 y1=%2240%22 x2=%220%22 y2=%22165%22%3E%3Cstop offset=%220%22 stop-color=%22%23e6d6fb%22/%3E%3Cstop offset=%22.5%22 stop-color=%22%23b493e8%22/%3E%3Cstop offset=%221%22 stop-color=%22%237452b8%22/%3E%3C/linearGradient%3E%3Cfilter id=%22s%22 x=%22-10%25%22 y=%22-20%25%22 width=%22120%25%22 height=%22150%25%22%3E%3CfeGaussianBlur stdDeviation=%221.6%22/%3E%3C/filter%3E%3C/defs%3E%3Cg filter=%22url%28%23s%29%22 fill=%22url%28%23g%29%22%3E%3Ccircle cx=%2266%22 cy=%22120%22 r=%2232%22/%3E%3Ccircle cx=%22108%22 cy=%2294%22 r=%2244%22/%3E%3Ccircle cx=%22164%22 cy=%2274%22 r=%2254%22/%3E%3Ccircle cx=%22222%22 cy=%2296%22 r=%2244%22/%3E%3Ccircle cx=%22256%22 cy=%22120%22 r=%2228%22/%3E%3Crect x=%2244%22 y=%22110%22 width=%22228%22 height=%2246%22 rx=%2223%22/%3E%3C/g%3E%3Cellipse cx=%22150%22 cy=%2262%22 rx=%2258%22 ry=%2214%22 fill=%22%23fff%22 opacity=%22.55%22/%3E%3C/svg%3E")}.c6{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 300 180%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 gradientUnits=%22userSpaceOnUse%22 x1=%220%22 y1=%2240%22 x2=%220%22 y2=%22165%22%3E%3Cstop offset=%220%22 stop-color=%22%23c9f3ef%22/%3E%3Cstop offset=%22.5%22 stop-color=%22%2379d3c8%22/%3E%3Cstop offset=%221%22 stop-color=%22%233b9d92%22/%3E%3C/linearGradient%3E%3Cfilter id=%22s%22 x=%22-10%25%22 y=%22-20%25%22 width=%22120%25%22 height=%22150%25%22%3E%3CfeGaussianBlur stdDeviation=%221.6%22/%3E%3C/filter%3E%3C/defs%3E%3Cg filter=%22url%28%23s%29%22 fill=%22url%28%23g%29%22%3E%3Ccircle cx=%2266%22 cy=%22120%22 r=%2232%22/%3E%3Ccircle cx=%22108%22 cy=%2294%22 r=%2244%22/%3E%3Ccircle cx=%22164%22 cy=%2274%22 r=%2254%22/%3E%3Ccircle cx=%22222%22 cy=%2296%22 r=%2244%22/%3E%3Ccircle cx=%22256%22 cy=%22120%22 r=%2228%22/%3E%3Crect x=%2244%22 y=%22110%22 width=%22228%22 height=%2246%22 rx=%2223%22/%3E%3C/g%3E%3Cellipse cx=%22150%22 cy=%2262%22 rx=%2258%22 ry=%2214%22 fill=%22%23fff%22 opacity=%22.55%22/%3E%3C/svg%3E")}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:0 0 16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{margin:0 0 8px;font-size:22px;color:var(--accent)}
.card h3{margin:0 0 4px;font-size:18px;color:var(--accent)}
.rv{opacity:0;transform:translateY(16px)}
.rv.in{opacity:1;transform:none;transition:opacity .55s ease,transform .55s ease}
.blk p{margin:0}
.blk .row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.speak{flex:none;padding:6px 10px;font-size:15px}
.opts{display:grid;gap:10px;margin:12px 0}
.opts button{text-align:right;font-size:17px}
.opts button.ok{background:color-mix(in srgb,var(--ok) 20%,var(--card));border-color:var(--ok)}
.opts button.bad{background:color-mix(in srgb,var(--bad) 18%,var(--card));border-color:var(--bad)}
.fb{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--soft);font-weight:500}
.figs{display:grid;gap:14px;grid-template-columns:1fr;margin:14px 0}
@media (min-width:640px){.figs.two{grid-template-columns:1fr 1fr}}
figure{margin:0;background:#fff;border-radius:14px;padding:10px;border:1px solid var(--line)}
figure img{width:100%;height:auto;display:block;border-radius:8px}
figcaption{color:var(--muted);font-size:15px;text-align:center;margin-top:6px}
.act-items{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.act-items button.used{opacity:.4}
.picked{margin:8px 0;color:var(--muted)}
.cls{display:grid;gap:10px;margin:10px 0}
.cls .it{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:10px 12px}
.cls .it .bks{display:flex;gap:6px;flex-wrap:wrap}
.cls .bks button{padding:6px 12px;font-size:15px}
.cls .bks button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cls .it.good{outline:2px solid var(--ok)}
.cls .it.wrong{outline:2px solid var(--bad)}
.think textarea{width:100%;min-height:70px;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.think .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.nextrow{display:flex;justify-content:center;margin:18px 0 6px}
.score{font-size:20px;font-weight:800;text-align:center;margin:10px 0}
footer{text-align:center;color:var(--muted);font-size:14px;padding:16px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ================= مظهر ثلاثي الأبعاد ================= */
.scene{perspective:900px;perspective-origin:50% 40%}
button{box-shadow:0 4px 0 var(--edge),0 8px 14px -6px var(--sh);transform:translateY(0);transition:transform .12s,box-shadow .12s,background .2s;font-weight:700}
button:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--edge),0 12px 18px -6px var(--sh)}
button:active{transform:translateY(4px);box-shadow:0 0 0 var(--edge),0 2px 4px var(--sh)}
button:disabled{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn-ghost{box-shadow:0 3px 0 var(--edge)}
.btn-main{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 82%,#fff),var(--accent) 55%,color-mix(in srgb,var(--accent) 82%,#000))}
.opts button{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 70%,#fff),var(--card))}
.card{box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 6px 0 -1px var(--edge),0 16px 26px -12px var(--sh);border-radius:var(--r);transform-style:preserve-3d}
.rv{opacity:0;transform:perspective(900px) rotateX(-14deg) translateY(28px) translateZ(-60px);transform-origin:50% 100%}
.rv.in{opacity:1;transform:none;transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
figure{box-shadow:0 8px 0 -2px var(--edge),0 18px 28px -10px var(--sh);transition:transform .25s;transform-style:preserve-3d}
figure:hover{transform:perspective(800px) rotateX(3deg) rotateY(-4deg) translateZ(10px)}
.sky{perspective:1000px;gap:18px}
.cloud{transform-style:preserve-3d;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(0);transition:transform .18s ease-out,filter .2s;filter:drop-shadow(0 14px 10px var(--sh));will-change:transform;box-shadow:none!important}
.cloud:hover{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px) scale(1.04)}
.cloud:active{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(2px) scale(.98);box-shadow:none}
.cloud .ico,.cloud .nm,.cloud small{transform:translateZ(34px);text-shadow:0 2px 0 rgba(255,255,255,.35)}
.cloud .ico{font-size:30px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))}
.cloud.leaving{opacity:0;transform:perspective(700px) translateZ(120px) scale(1.4);transition:opacity .75s,transform .75s}
/* حلزون DNA ثلاثي الأبعاد */
.hx{height:250px;margin:2px auto 6px;display:block;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.hx:active{cursor:grabbing}.hx canvas{width:100%;height:100%;display:block}
.hx3{position:relative;width:150px;height:200px;transform-style:preserve-3d;transform:rotateX(-14deg) rotateY(0deg)}
.rg{position:absolute;left:0;top:0;width:150px;height:14px;transform-style:preserve-3d}
.rg i{position:absolute;top:0;height:14px;width:14px;border-radius:50%;margin-top:0;background:radial-gradient(circle at 32% 28%,#fff 0 12%,var(--c) 36%,color-mix(in srgb,var(--c) 55%,#000) 100%);box-shadow:0 3px 5px rgba(0,0,0,.35)}
.rg i:nth-of-type(1){left:0}.rg i:nth-of-type(2){right:0}
.rg b{position:absolute;left:12px;right:12px;top:5px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--c),var(--d));box-shadow:0 1px 2px rgba(0,0,0,.3)}
.hxn{text-align:center;color:var(--muted);font-size:14px;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){.rv,.rv.in{transform:none!important;transition:none!important}.cloud{transition:none}}

</style>
</head>
<body>
<header>
  <h1>🧬 المادة الوراثية</h1>
</header>
<main>

  <section id="home">
    <div class="hx" id="hx"><canvas id="hxc" aria-label="نموذج ثلاثي الأبعاد لجزيء DNA" role="img"></canvas></div><p class="hxn">اسحب الحلزون بإصبعك لتديره 🔄</p>
    <p class="hint">اختر سحابة لتبدأ القسم. تظهر علامة ✓ بعد إنهائه.</p>
    <div class="sky" id="sky"></div>
  </section>

  <section id="pscreen" class="hidden">
    <div class="card">
      <h2 id="pTitle">توقّع قبل أن تتعلم</h2>
      <p id="pQ" style="font-size:20px;font-weight:700;margin:6px 0 0"></p>
      <div class="opts" id="pOpts"></div>
      <div id="pFb" class="fb hidden"></div>
      <div class="nextrow"><button id="pNext" class="btn-main hidden">التالي</button></div>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">
      <button id="bBack" class="btn-ghost">→ الرئيسية</button>
      <span id="aSec" style="font-weight:800;color:var(--accent)"></span>
    </div>
    <div class="card" id="introCard">
      <h2>🎓 شرح مبسّط للقسم</h2>
      <p id="introTxt" style="margin:0 0 12px"></p>
    </div>

<script type="application/json" id="narr">{"title": {"ar": "المادة الوراثية", "en": "The Genetic Material"}, "intro": {"ar": ["أهلاً بك في درس المادة الوراثية.", "هنا نكتشف كيف عرف العلماء أن المعلومات الوراثية مخزنة في جزيء دي إن إيه.", "ثم نرى كيف يُحزم هذا الجزيء داخل الكروموسوم، وما الحموض النووية، وكيف يضاعف نفسه.", "وفي النهاية نتعرف على الطفرات ونختبر معلوماتنا."], "en": ["Welcome to the lesson on the genetic material.", "Here we discover how scientists found out that genetic information is stored in the DNA molecule.", "Then we see how this molecule is packed inside the chromosome, what nucleic acids are, and how DNA copies itself.", "Finally, we learn about mutations and test what we have learned."]}, "tabs": {"home": {"ar": ["مرحباً بك في الشاشة الرئيسية لدرس المادة الوراثية.", "في الوسط نموذج ثلاثي الأبعاد لجزيء دي إن إيه يدور ببطء، فاسحبه بإصبعك لتديره بنفسك.", "وحوله ست غيوم، كل غيمة منها مقطع من الدرس.", "المقطع الأول عن اكتشاف المادة الوراثية، والثاني عن تركيب الكروموسوم.", "والثالث عن الحموض النووية، والرابع عن تضاعف دي إن إيه.", "والخامس عن الطفرات، والسادس أسئلة الفصل.", "اضغط على أي غيمة لتبدأ المقطع.", "في كل مقطع سؤال توقع، ثم شرح مع صور، ثم نشاط صغير وسؤال فكر.", "أجب بتركيز، فلكل سؤال محاولة واحدة فقط.", "ابدأ بالغيمة الأولى إن أردت أن تسير مع الدرس بالترتيب."], "en": ["Welcome to the home screen of the genetic material lesson.", "In the center is a three dimensional model of the DNA molecule turning slowly, so drag it with your finger to rotate it yourself.", "Around it are six clouds, and each cloud is a section of the lesson.", "The first section is about the discovery of the genetic material, and the second is about the structure of the chromosome.", "The third is about nucleic acids, and the fourth is about DNA replication.", "The fifth is about mutations, and the sixth is the chapter questions.", "Tap any cloud to begin that section.", "Each section has a prediction question, then an explanation with pictures, then a small activity and a thinking question.", "Answer with focus, because you have only one attempt for each question.", "Start with the first cloud if you want to follow the lesson in order."]}, "s1": {"ar": ["في هذا المقطع نتعلم كيف اكتشف العلماء المادة الوراثية.", "ابدأ بسؤال التوقع، وفكر في المكون الذي يحمل المعلومات الوراثية داخل الكروموسوم.", "بدأ علم الوراثة مع العالم مندل الذي وضع أسسه، ويذكر الكتاب أن ذلك كان في عام ألف وثمانمئة وخمسين.", "بعد ذلك توصل العلماء إلى أن مكونات الكروموسوم الرئيسة هما دي إن إيه والبروتين.", "فنشأ سؤال كبير: أيهما يحمل المعلومات الوراثية؟", "احتاج الجواب إلى عشرات السنين من البحث، وإلى سلسلة من التجارب المتتالية.", "من أبرز هذه التجارب تجارب هيرشي وتشيس، وتجارب غريفث، وتجارب آفري ومساعديه.", "لاحظ الصورة التي تبين العلاقة بين الكروموسوم ودي إن إيه.", "وقد خلص العلماء إلى أن العامل الوراثي يتركز في جزيء دي إن إيه.", "وهناك علاقة تركيبية بين الكروموسومات ودي إن إيه، وتنتقل الكروموسومات من خلية إلى أخرى ومن جيل إلى آخر.", "بعد القراءة جرب نشاط الترتيب، وحاول أن ترتب التجارب حسب زمنها من الأقدم إلى الأحدث.", "ثم فكر في سؤال لماذا استغرق الاكتشاف وقتاً طويلاً، وكتب إجابتك بكلماتك."], "en": ["In this section we learn how scientists discovered the genetic material.", "Start with the prediction question, and think about which component inside the chromosome carries the genetic information.", "The science of genetics began with the scientist Mendel, who laid its foundations, and the book mentions that this was in the year eighteen fifty.", "Later, scientists found that the main components of the chromosome are DNA and protein.", "This raised a big question: which one carries the genetic information?", "The answer took decades of research and a series of successive experiments.", "The most notable are the experiments of Hershey and Chase, the experiments of Griffith, and the experiments of Avery and his colleagues.", "Look at the picture that shows the relationship between the chromosome and DNA.", "Scientists concluded that the genetic factor is concentrated in the DNA molecule.", "There is also a structural relationship between chromosomes and DNA, and chromosomes pass from one cell to another and from one generation to the next.", "After reading, try the ordering activity, and try to arrange the experiments by time from the oldest to the newest.", "Then think about why the discovery took so long, and write your answer in your own words."]}, "s2": {"ar": ["في هذا المقطع نرى كيف يُحزم جزيء دي إن إيه الطويل داخل الكروموسوم.", "ابدأ بسؤال التوقع، ثم اقرأ الشرح وتأمل الصور.", "يتركب الكروموسوم في الكائنات الحية حقيقية النواة من دي إن إيه وبروتينات.", "ومن أهم هذه البروتينات بروتين الهستون.", "يرتبط الهستون في مجموعات من ثماني جزيئات على شكل خرزات.", "ويلتف حول هذه الخرزات جزيء دي إن إيه مرتين.", "ثم يتجمع الهستون، بثمانية جزيئات وجزيء تاسع، مع جزيء دي إن إيه، ليكوّنوا وحدة تسمى النيوكليوسوم.", "لاحظ في الصور كيف يلتف الخيط حول الخرزات، وكيف يظهر الكروموسوم في النهاية.", "وللنيوكليوسوم دور مهم في تكدس الكروموسوم أثناء الانقسامات الخلوية.", "وله كذلك دور في تنظيم عملية الترجمة.", "بعد ذلك جرب نشاط الترتيب، وحاول أن ترتب مستويات التكدس من الأبسط إلى الأعقد.", "وأخيراً فكر في سؤال التسمية، واكتب إجابتك."], "en": ["In this section we see how the long DNA molecule is packed inside the chromosome.", "Start with the prediction question, then read the explanation and study the pictures.", "In living things with a true nucleus, the chromosome is made of DNA and proteins.", "One of the most important of these proteins is histone.", "Histones join in groups of eight molecules shaped like beads.", "The DNA molecule winds around these beads twice.", "Then the histones, eight molecules plus a ninth one, gather with the DNA molecule to form a unit called the nucleosome.", "Notice in the pictures how the thread winds around the beads, and how the chromosome appears in the end.", "The nucleosome plays an important role in the coiling of the chromosome during cell division.", "It also has a role in regulating translation.", "After that, try the ordering activity, and try to arrange the levels of packing from the simplest to the most complex.", "Finally, think about the naming question, and write your answer."]}, "s3": {"ar": ["في هذا المقطع نتعرف على الحموض النووية، وهما دي إن إيه وآر إن إيه.", "أجب أولاً عن سؤال التوقع، ثم تابع الشرح والصور.", "الحموض النووية جزيئات حيوية كبيرة، تتكون من وحدات بنائية تسمى النيوكليوتيدات.", "يتكون كل نيوكليوتيد من ثلاثة أجزاء: سكر خماسي، ومجموعة فوسفات، وقاعدة نيتروجينية.", "ترتبط مجموعة الفوسفات بذرة الكربون رقم خمسة، وترتبط القاعدة بذرة الكربون رقم واحد.", "السكر في آر إن إيه هو الريبوز، وفي دي إن إيه هو الريبوز منقوص الأكسجين.", "والقواعد في دي إن إيه هي الثايمين والجوانين والأدينين والسايتوسين.", "أما في آر إن إيه فيوجد اليوراسيل بدلاً من الثايمين.", "ويتكون جزيء دي إن إيه من سلسلتين ملتفتين بشكل لولبي، ترتبط قواعدهما ببعضها بروابط هيدروجينية.", "والسلسلتان متعاكستان في الاتجاه، وتسمى نهايتاهما خمسة شرطة وثلاثة شرطة.", "لاحظ الصور التي تقارن بين النيوكليوتيدين، وجرب نشاط استخلاص دي إن إيه من الفراولة إن أتيح لك.", "ثم جرب نشاط التصنيف، وحاول أن تضع كل عنصر في مكانه، وفكر في سؤال التسمية."], "en": ["In this section we get to know nucleic acids, which are DNA and RNA.", "First answer the prediction question, then follow the explanation and the pictures.", "Nucleic acids are large biological molecules made of building units called nucleotides.", "Each nucleotide consists of three parts: a five carbon sugar, a phosphate group, and a nitrogenous base.", "The phosphate group attaches to carbon number five, and the base attaches to carbon number one.", "The sugar in RNA is ribose, and the sugar in DNA is deoxyribose.", "The bases in DNA are thymine, guanine, adenine, and cytosine.", "In RNA, uracil is found instead of thymine.", "The DNA molecule consists of two strands twisted in a spiral shape, and their bases are linked to each other by hydrogen bonds.", "The two strands run in opposite directions, and their ends are called five prime and three prime.", "Look at the pictures that compare the two nucleotides, and try the strawberry DNA extraction activity if it is available to you.", "Then try the classification activity, and try to place each item where it belongs, and think about the naming question."]}, "s4": {"ar": ["في هذا المقطع نتعلم كيف يصنع الكائن الحي نسخة مطابقة من جزيء دي إن إيه.", "ابدأ بسؤال التوقع، ثم اقرأ الشرح وشاهد الصور.", "يتضاعف دي إن إيه في مرحلة إس من دورة الخلية، وهي مرحلة بناء دي إن إيه.", "في المرحلة الأولى يتحرك إنزيم الهيليكيز على طول الجزيء، ويفك الالتواء ويفصل السلسلتين.", "وترتبط بالسلسلتين بروتينات خاصة تحافظ على انفصالهما.", "في المرحلة التالية تعمل إنزيمات بلمرة دي إن إيه على ربط نيوكليوتيدات جديدة بالسلاسل القديمة بشكل متمم.", "وفي المرحلة الأخيرة يربط إنزيم الليغيز السلسلتين، فتكون الجزيئات الناتجة مطابقة للأصلية.", "ويسمى هذا التضاعف شبه المحافظ، لأن كل جزيء جديد يحتوي على سلسلة قديمة وسلسلة جديدة.", "وقد تحدث أخطاء في ترتيب القواعد لضخامة المادة الوراثية وسرعة التضاعف، لكن نظاماً من الإنزيمات يصحح هذه الأخطاء.", "وأهمية التضاعف أنه يحافظ على كمية المادة الوراثية ونوعيتها، فتنتقل في الانقسام المتساوي ومن جيل إلى آخر.", "جرب نشاط الترتيب، وحاول أن ترتب مراحل الآلية بنفسك.", "ثم فكر في سؤال الأخطاء، واكتب ما تتوقعه."], "en": ["In this section we learn how a living thing makes an identical copy of the DNA molecule.", "Start with the prediction question, then read the explanation and watch the pictures.", "DNA replicates in the S phase of the cell cycle, which is the phase of building DNA.", "In one stage, the enzyme helicase moves along the molecule, unwinds it, and separates the two strands.", "Special proteins attach to the strands to keep them apart.", "In another stage, DNA polymerase enzymes join new nucleotides to the old strands in a complementary way.", "In the final stage, the enzyme DNA ligase joins the strands, so the resulting molecules are identical to the original.", "This replication is called semi conservative, because each new molecule contains one old strand and one new strand.", "Mistakes may occur in the order of the bases because the genetic material is huge and replication is fast, but a system of enzymes corrects these errors.", "Replication is important because it preserves the amount and the quality of the genetic material, which is passed on in mitosis and from one generation to the next.", "Try the ordering activity, and try to arrange the stages of the mechanism yourself.", "Then think about the question on errors, and write what you expect."]}, "s5": {"ar": ["في هذا المقطع نتعرف على الطفرات.", "أجب أولاً عن سؤال التوقع، ثم تابع الشرح.", "الطفرة تغير مفاجئ في المادة الوراثية المتحكمة في صفة معينة.", "وتعد الطفرة مؤثرة إذا تم توارثها.", "قد ينتج عنها صفات غير مرغوبة، كالتشوهات في الإنسان أو نقص المحصول في النبات.", "وقد ينتج عنها صفات مرغوبة يحاول الإنسان استحداثها بطرق علمية.", "وللطفرات سببان: تلقائية تحدث أثناء الانقسامات الخلوية لأسباب غير محددة، ومحفزة بسبب عوامل خارجية كالمواد الكيميائية والإشعاعات.", "النوع الأول هو الطفرة الجينية، وهي تغير في التركيب الكيميائي للجين بحذف أو إضافة أو استبدال قاعدة نيتروجينية أو أكثر.", "فينتج بروتين مختلف يسبب ظهور صفة جديدة.", "والنوع الثاني هو الطفرة الكروموسومية، وهي تغير في عدد الكروموسومات أو في تركيبها بسبب خلل أثناء الانقسام.", "تأمل الصورة التي تعرض أشكالاً مختلفة للطفرات في نبات وحيوان وإنسان.", "ثم جرب نشاط التصنيف، وفرق بين الطفرة الجينية والكروموسومية، وفكر في سؤال التوريث."], "en": ["In this section we get to know mutations.", "First answer the prediction question, then follow the explanation.", "A mutation is a sudden change in the genetic material that controls a certain trait.", "A mutation is considered significant if it is inherited.", "It may produce unwanted traits, such as deformities in humans or reduced yield in plants.", "It may also produce desirable traits that humans try to produce through scientific methods.", "Mutations have two causes: spontaneous ones that occur during cell division for unknown reasons, and induced ones caused by external factors such as chemicals and radiation.", "The first type is the gene mutation, which is a change in the chemical structure of a gene by deleting, adding, or substituting one or more nitrogenous bases.", "This produces a different protein that causes a new trait to appear.", "The second type is the chromosomal mutation, which is a change in the number or structure of chromosomes caused by a fault during cell division.", "Look at the picture showing different forms of mutations in a plant, an animal, and a human.", "Then try the classification activity, distinguish between gene and chromosomal mutations, and think about the question on inheritance."]}, "s6": {"ar": ["وصلنا إلى أسئلة الفصل، وهي خمسة أسئلة تراجع بها ما تعلمته.", "اقرأ كل سؤال بهدوء، ثم اختر الإجابة التي تراها صحيحة.", "ولكل سؤال محاولة واحدة، فلا تتسرع.", "إن شككت في إجابة فتذكر ما درسناه عن مكونات الكروموسوم.", "وتذكر الفرق بين الحمضين النوويين دي إن إيه وآر إن إيه.", "وتذكر دور كل إنزيم في تضاعف دي إن إيه.", "وتذكر أيضاً معنى التضاعف شبه المحافظ.", "يمكنك الرجوع إلى المقاطع السابقة من الشاشة الرئيسية لتراجع ما تشاء.", "ثم عد وأجب بثقة.", "بالتوفيق يا بطل."], "en": ["We have reached the chapter questions, five questions to review what you have learned.", "Read each question calmly, then choose the answer you think is correct.", "You have one attempt for each question, so do not rush.", "If you are unsure about an answer, remember what we studied about the components of the chromosome.", "Remember the difference between the two nucleic acids, DNA and RNA.", "Remember the role of each enzyme in DNA replication.", "Remember also what semi conservative replication means.", "You can go back to the earlier sections from the home screen to review whatever you like.", "Then come back and answer with confidence.", "Good luck, champion."]}}}</script>
