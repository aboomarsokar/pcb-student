var KH={"أي الكميات التالية كمية قياسية؟": "الكمية القياسية يكفي لتحديدها «مقدار + وحدة» فقط، ولا معنى لأن نضيف إليها اتجاهاً.\nجرّب مع كل خيار أن تقول «... نحو الشمال»: إن بدت العبارة غريبة فهي على الأرجح قياسية، وإن كانت مفهومة فهي متجهة.", "أي الكميات التالية كمية متجهة؟": "الكمية المتجهة تحتاج إلى «مقدار + وحدة + اتجاه» معاً.\nتذكّر أن بعض الكميات لها شقيق قياسي وآخر متجه (مثل المسافة والإزاحة). ما الذي يدلّ على الاتجاه في اسم الكمية؟ ثم ابحث عنه بين الخيارات.", "الكمية المتجهة تحتاج لتحديدها إلى:": "فكّر في مثال: إذا قلت لصديقك «ابتعد 5 أمتار» فهل يعرف أين يذهب؟\nاسأل نفسك: ما العناصر التي لا يكتمل وصف الكمية المتجهة إلا بها؟ وتأكد أن الخيار الذي تختاره لا ينقصه شيء ولا يزيد عليه.", "هل يجوز جمع قوة مع سرعة؟": "قاعدة مهمة: لا نجمع إلا كميات من النوع نفسه؛ فلا نجمع أمتاراً مع ثوانٍ مثلاً.\nانظر إلى القوة والسرعة: هل هما قياس للشيء نفسه؟ وهل يكفي تساوي المقدار أو اتحاد الاتجاه لنجمعهما؟", "العبارة «سرعة سيارة 20 كم/ساعة باتجاه الشرق» تمثل كمية:": "حلّل العبارة إلى أجزائها: ما الذي ذُكر فيها؟ رقم ووحدة، وهل ذُكر شيء آخر؟\nثم طابق ما وجدته مع تعريف الكمية القياسية والمتجهة.", "أي المجموعات التالية جميعها كميات متجهة؟": "المطلوب أن تكون كل الكميات في المجموعة متجهة، فيكفي أن تحتوي المجموعة كمية واحدة قياسية لتُستبعد.\nصنّف الكميات كلاً على حدة أولاً (قياسية/متجهة)، ثم افحص الخيارات واحداً واحداً.", "أي العبارات التالية صحيحة؟": "ميّز بين الكتلة والوزن: الكتلة هي مقدار المادة في الجسم، والوزن هو قوة جذب الأرض للجسم.\nاسأل: أيهما له اتجاه (نحو مركز الأرض)؟ وأيهما يُعبَّر عنه بمقدار فقط؟", "تحرك جسم 5 م شرقاً ثم 5 م غرباً، فتكون المسافة والإزاحة على الترتيب:": "المسافة هي طول المسار الكلي الذي قطعه الجسم مهما تغيّر اتجاهه.\nالإزاحة هي الفرق بين نقطة البداية ونقطة النهاية مع الاتجاه. ارسم الحركة على خط مستقيم، وحدّد أين بدأ الجسم وأين انتهى.", "متجهان |أ| = 3 و |ب| = 4 بالاتجاه نفسه، فإن مقدار المحصلة واتجاهها:": "عندما يكون المتجهان في الاتجاه نفسه تُجمع مقاديرهما مباشرة، وتكون المحصلة في ذلك الاتجاه.\nأما إذا كانا متعاكسين فيُطرح الأصغر من الأكبر. حدّد أي الحالتين لدينا ثم احسب.", "ذيل المتجه هو:": "يُرسم المتجه على شكل سهم له طرفان: طرف فيه رأس السهم، وطرف آخر في الجهة المقابلة له.\nتخيّل سهماً حقيقياً: ذيله يقع في الجهة المعاكسة لرأسه. اسأل نفسك: أي طرف من المتجه يقابل رأس السهم، وهل هو مكان البدء أم الانتهاء عند رسم المتجه؟", "طول السهم الذي يمثل المتجه يدل على:": "عند رسم متجه بمقياس رسم معيّن يكون لكل جزء من السهم معنى. فكّر: ماذا يخبرنا طول السهم، وماذا يخبرنا شكله وجهة رأسه؟\nتذكّر أن الكمية المتجهة لها مقدار واتجاه ووحدة، وكل واحد منها يُمثَّل بجزء مختلف من الرسم؛ حدّد الجزء الذي يعبّر عنه الطول.", "الاتجاهات الأصلية الأربعة هي:": "الاتجاهات الأصلية هي الاتجاهات الرئيسية التي تقابل أضلاع البوصلة، وتتعامد على بعضها وتُسمّى بأسماء بسيطة من كلمة واحدة.\nأما الاتجاهات التي تقع بين اتجاهين أصليين فتُسمّى فرعية. تحقّق أن الخيار يحتوي أربعة اتجاهات من كلمة واحدة وأنها خاصة بالبوصلة على سطح الأرض.", "متجه الوحدة هو متجه:": "متجه الوحدة يُستخدم لتعيين الاتجاه فقط، فهو بمثابة سهم مرجعي لا نهتم فيه بالكبر.\nاسأل نفسك: ما مقداره حتى يصلح لهذه المهمة (رقم بسيط لا يغيّر مقدار أي كمية عند الضرب)؟ وهل ما زال له اتجاه أم لا؟ قارن ذلك بالخيارات.", "يتساوى متجهان إذا تساويا في:": "المتجه كمية لها وصفان يحدّدانه. لكي نقول إن متجهين متساويان يجب أن يتطابق وصفاهما كاملين.\nلاحظ أن مكان رسم المتجه على الورقة لا يغيّر المتجه إذا حرّكناه موازياً لنفسه. فاسأل: ما الصفات التي لا بد أن تتطابق؟", "معكوس المتجه (أ) هو متجه:": "معكوس المتجه هو المتجه الذي إذا جمعناه مع المتجه الأصلي أعطى محصلة صفراً، أي يلغيه تماماً.\nفكّر في شخصين يشدّان حبلاً بالقوة نفسها من جهتين متقابلتين: ماذا تغيّر بينهما وماذا بقي كما هو؟ ثم ابحث عن الخيار الذي يطابق ذلك.", "إذا ضُرب متجه في العدد 3 فإن:": "ضرب المتجه في عدد ثابت (سلّمي) يغيّر طوله بحسب قيمة العدد، ويتحدد اتجاهه بإشارة هذا العدد.\nإذا كان العدد أكبر من 1 فهو يكبّر الطول، وإذا كان بين 0 و1 فهو يصغّره، وإذا كان سالباً فهو يعكس الاتجاه. طبّق ذلك على العدد في السؤال.", "الطريقة البيانية التي تستخدم لإيجاد محصلة متجهين لهما نقطة بداية واحدة هي طريقة:": "عندما يخرج متجهان من نقطة بداية واحدة نرسم من نهاية كل منهما خطاً موازياً للآخر فيتكوّن شكل رباعي.\nالمحصلة هي القطر الخارج من نقطة البداية المشتركة. فكّر في اسم الشكل الرباعي الذي أضلاعه المتقابلة متوازية، وابحث عن الطريقة التي ترتبط به.", "إذا كان 1 سم على الورقة يمثل 10 م، فإن 100 م تُمثَّل بسهم طوله:": "مقياس الرسم يربط طولاً على الورق بمسافة حقيقية. اكتب العلاقة على شكل نسبة: كل سنتيمتر واحد يقابل عدداً معيناً من الأمتار.\nلإيجاد طول السهم اقسم المسافة الحقيقية على قيمة ما يمثله السنتيمتر الواحد، وتأكد أن الوحدة الناتجة هي سنتيمتر.", "متجهان متعامدان مقداراهما 3 و 4، فإن مقدار محصلتهما:": "عندما يكون المتجهان متعامدين يشكلان ضلعي مثلث قائم الزاوية والمحصلة هي الوتر.\nاستخدم نظرية فيثاغورس: مربع الوتر = مجموع مربعي الضلعين. اربع كل مقدار واجمعهما، ثم خذ الجذر التربيعي للمجموع.", "في المسألة السابقة (3 و 4 متعامدان) زاوية ميل المحصلة θ = ظا⁻¹(4÷3) تساوي تقريباً:": "زاوية ميل المحصلة هي الزاوية بين المحصلة والمتجه الذي نقيس منه، وفي المثلث القائم ظل الزاوية = المقابل ÷ المجاور.\nالمعطى في السؤال يخبرك أي ضلع يكون في البسط وأي ضلع في المقام، فاحسب الناتج داخل القوسين أولاً.\nثم استخدم الآلة الحاسبة بوضع الدرجات (DEG) وطبّق الدالة العكسية للظل، وقارن الناتج بالخيارات.", "متجهان |أ| = 10 و |ب| = 6 متعاكسان (180°)، فإن مقدار المحصلة واتجاهها:": "عندما يكون المتجهان على خط واحد وباتجاهين متعاكسين فإن المقادير تُطرح بدلاً من أن تُجمع.\nاطرح المقدار الأصغر من الأكبر لتحصل على مقدار المحصلة. أما اتجاهها فيكون نحو المتجه الذي كان أقوى (أكبر مقداراً)؛ حدّد أي المتجهين هو ذلك.", "وحدة التسارع في النظام الدولي هي:": "التسارع هو معدل تغيّر السرعة بالنسبة للزمن، أي: التسارع = التغيّر في السرعة ÷ الزمن.\nاكتب وحدة السرعة في النظام الدولي، ثم اقسمها على وحدة الزمن، وانظر إلى الصيغة الناتجة وطابقها مع الخيارات.", "إذا كان منحنى (ف–ز) خطاً أفقياً فإن الجسم:": "في منحنى الموضع (الإزاحة) مع الزمن يدل الميل على السرعة. الخط الأفقي معناه أن الميل لا يتغيّر ولا يوجد ارتفاع أو انخفاض.\nاسأل نفسك: إذا لم يتغيّر موضع الجسم مع مرور الزمن فماذا يحدث لسرعته، وبالتالي لتسارعه؟ وانتبه للفرق بين الخط الأفقي والخط المائل.", "جسم أكمل دورة كاملة على دائرة نصف قطرها نق، فإن المسافة والإزاحة:": "المسافة هي طول المسار الكلي الذي سلكه الجسم، أما الإزاحة فهي المسافة المستقيمة من نقطة البداية إلى نقطة النهاية مع الاتجاه.\nمحيط الدائرة = 2π نق. اسأل نفسك: عندما يكمل الجسم دورة كاملة أين يصبح بالنسبة لنقطة بدايته؟ وكم يكون البعد بين البداية والنهاية؟", "ميل المماس لمنحنى (ف–ز) عند لحظة معينة يمثل:": "في منحنى (ف–ز) ميل الخط المستقيم يساوي التغيّر في الموضع ÷ التغيّر في الزمن. فما الكمية الفيزيائية التي لها هذا التعريف؟\nأما المماس فهو المستقيم الذي يلمس المنحنى عند نقطة واحدة فقط، فهو يعطي الميل عند تلك اللحظة بالذات وليس خلال فترة. اجمع الفكرتين لاختيار الجواب.", "تتأخر الريشة في السقوط عن الحجر في الهواء بسبب:": "عندما يسقط جسم في الهواء تؤثر فيه قوتان: جذب الأرض، وقوة أخرى من الهواء تعاكس الحركة وتزداد مع مساحة الجسم وخفته.\nتذكّر تجربة السقوط في الفراغ حيث تسقط الأجسام معاً. فكّر: ما العامل الذي يختلف بين الريشة والحجر في الهواء ويختفي في الفراغ؟", "المساحة تحت منحنى (ع–ز) تمثل:": "إذا تحرك الجسم بسرعة ثابتة فإن مساحة المستطيل تحت المنحنى = السرعة × الزمن. فما الكمية الفيزيائية الناتجة عن ضرب السرعة في الزمن؟\nالفكرة نفسها تنطبق عندما تتغيّر السرعة، فالمساحة تجمع هذه النواتج الصغيرة معاً. طابق وحدة الناتج (م/ث × ث) مع الخيارات.", "مقذوف رأسياً للأعلى: عند أقصى ارتفاع تكون سرعته وتسارعه:": "عندما يُقذف الجسم للأعلى تتناقص سرعته تدريجياً بسبب الجاذبية، ثم تنعكس حركته نحو الأسفل. عند اللحظة التي ينعكس فيها اتجاه الحركة ما قيمة السرعة؟\nأما الجاذبية فتبقى مؤثرة طوال الرحلة بدون توقف، ولها اتجاه ثابت نحو الأسفل. فكّر في تسارع الجاذبية هل يتغير عند القمة أم لا؟", "جسم سقط سقوطاً حراً من السكون (جـ = 10 م/ث²)، فإن سرعته بعد 3 ثوانٍ:": "في السقوط الحر من السكون السرعة الابتدائية تساوي صفراً، والتسارع هو تسارع الجاذبية المعطى.\nاستخدم القانون: ع = ع₀ + جـ × ز. عوّض السرعة الابتدائية والتسارع والزمن بالقيم المعطاة بنفس الوحدات (م/ث²، ثانية) ثم احسب الناتج.", "وحدة القوة في النظام الدولي:": "القوة تُعرَّف بقانون نيوتن الثاني: ق = ك × ت. اكتب وحدة الكتلة ووحدة التسارع في النظام الدولي ثم اضربهما.\nهذه الوحدة المركّبة لها اسم خاص تكريماً لعالم، وبعض الخيارات تمثل وحدات كميات أخرى مثل الطاقة والقدرة والضغط. اربط كل وحدة بكميتها.", "القانون الأول لنيوتن يسمى قانون:": "يصف القانون الأول لنيوتن ما يحدث للجسم عندما تكون محصلة القوى المؤثرة فيه صفراً: يبقى على حالته من السكون أو الحركة المنتظمة.\nهذه الخاصية تعني ممانعة الجسم لأي تغيير في حالته الحركية. فكّر في الاسم الذي يعبّر عن هذه الخاصية.", "العلاقة ق = ك × ت تمثل القانون:": "علاقة ق = ك × ت تربط محصلة القوى بالكتلة والتسارع، أي أنها تخبرنا كيف تتغير حركة الجسم عندما تؤثر فيه قوة.\nتذكّر أن كل قانون من قوانين نيوتن الثلاثة يصف أمراً مختلفاً: الأول عن حالة عدم وجود محصلة، والثالث عن أزواج القوى المتبادلة. حدّد أيها يتناول العلاقة بين القوة والتسارع، وانتبه أن قانون هوك يخص النوابض.", "القصور الذاتي للجسم يعتمد على:": "القصور الذاتي هو مقاومة الجسم لتغيير حالته الحركية، فالأجسام الثقيلة يصعب تحريكها أو إيقافها.\nفكّر: إذا دفعت صندوقاً فارغاً ثم صندوقاً مملوءاً بالكتب أيهما أصعب تحريكه؟ وما الخاصية التي تغيّرت بينهما: اللون أم السرعة أم الحجم أم خاصية أخرى؟", "الإشارة السالبة في قانون هوك ق = −أ·س تعني أن قوة النابض:": "قانون هوك يربط قوة النابض بمقدار استطالته أو انضغاطه (الإزاحة س عن وضع الاتزان). والنابض يحاول دائماً أن يعود إلى وضعه الطبيعي.\nفكّر: إذا سحبت النابض نحو اليمين فإلى أي جهة يشدّ يدك؟ وماذا تدل عليه الإشارة السالبة عن العلاقة بين اتجاه القوة واتجاه الإزاحة؟", "جسم كتلته 5 كغم أثرت فيه محصلة قوى 20 نيوتن، فإن تسارعه:": "استخدم قانون نيوتن الثاني: ق = ك × ت، ومنه ت = ق ÷ ك.\nالقوة هنا هي المحصلة، والكتلة بالكيلوغرام، والتسارع بوحدة م/ث². عوّض القيمتين المعطاتين مباشرة في العلاقة وأجرِ القسمة.", "وزن جسم على الأرض 60 نيوتن، فإن وزنه على القمر (سدس وزنه على الأرض) وكتلته:": "الوزن قوة جذب الكوكب للجسم، ويتغيّر بتغيّر الجاذبية. أما الكتلة فهي مقدار المادة في الجسم، وهي ثابتة أينما ذهب.\nاحسب الوزن الجديد بضرب الوزن الأول في الكسر المعطى في السؤال. ثم اسأل: هل يتغيّر عدد الذرات في الجسم عند نقله إلى القمر؟", "جسم كتلته 2 كغم يتحرك في دائرة نصف قطرها 1 م بسرعة 3 م/ث، فإن القوة المركزية:": "القوة المركزية هي القوة اللازمة لإبقاء الجسم في مسار دائري، وقانونها: ق = ك × ع² ÷ نق.\nعوّض الكتلة والسرعة ونصف القطر بوحداتها الصحيحة (كغم، م/ث، م). تذكّر أن السرعة تُربَّع أولاً ثم تُضرب في الكتلة ثم تُقسم على نصف القطر.", "ارتداد خرطوم الإطفاء إلى الخلف عند اندفاع الماء يُفسَّر بقانون نيوتن:": "عندما يندفع الماء بقوة إلى الأمام من الخرطوم فإن الخرطوم نفسه يتأثر بشيء ما. ما هي القوة التي يؤثر بها الماء في الخرطوم؟\nتذكّر قانون نيوتن الذي ينص على أن لكل فعل رد فعل. حدّد من يؤثر في من، وما اتجاه كل قوة مقارنةً بالأخرى.", "وحدة الضغط في النظام الدولي:": "الضغط = القوة العمودية ÷ المساحة. اكتب وحدة القوة في النظام الدولي ووحدة المساحة، ثم اقسم إحداهما على الأخرى.\nالوحدة الناتجة لها اسم خاص أيضاً تكريماً لعالم، ابحث بين الخيارات عن الوحدة التي تطابق قياس الضغط وليس القوة أو الطاقة أو الكتلة.", "الضغط يساوي:": "الضغط يقيس مدى تركيز القوة على مساحة معينة. تخيّل أن تضغط بإصبعك على جدار ثم تضغط بكفك بالقوة نفسها: أيهما يؤثر أكثر؟\nمن هذه الفكرة فكّر كيف يتناسب الضغط مع القوة (طردياً أم عكسياً) ومع المساحة، ثم اختر الصيغة التي تعبّر عن ذلك.", "الضغط الجوي المعياري يعادل:": "الضغط الجوي هو ضغط عمود الهواء فوقنا، ويُقاس بالبارومتر الزئبقي بارتفاع عمود الزئبق في الأنبوب عند مستوى سطح البحر.\nتذكّر القيمة المعيارية التي تعادل جوياً واحداً (1 atm) بوحدة ملم زئبق، وانتبه لمنازل العدد.", "ضغط السائل عند نقطة يعتمد على:": "في السوائل الساكنة يُحسب الضغط بالعلاقة: ض = ث × جـ × ع (الكثافة × تسارع الجاذبية × العمق).\nانظر إلى المتغيرات الموجودة في القانون، وانتبه أن شكل الوعاء أو كمية السائل الكلية لا تظهر فيه. ثم اختر الخيار الذي يطابق ما يظهر في القانون.", "المكبس الهيدروليكي يعمل وفق مبدأ:": "في المكبس الهيدروليكي نؤثر بقوة صغيرة على مكبس صغير فتنتقل إلى مكبس كبير فيرفع حملاً ثقيلاً.\nفكّر في الفكرة التي تفسر انتقال الضغط من نقطة إلى بقية السائل المحبوس دون نقصان، وانسبها إلى العالم الذي وضعها. وانتبه إلى أن العلماء الآخرين في الخيارات اشتهروا بأفكار تخص الطفو والنوابض والحركة.", "يطفو الجسم في السائل إذا كانت كثافته:": "يحدّد الطفو أو الغرق كون الجسم أكثف أو أخف من السائل المحيط به. تخيّل قطعة خشب وقطعة حديد في ماء.\nقارن بين كثافة الجسم وكثافة السائل: متى تكون القوة الرافعة (قوة الطفو) كافية لدفع الجسم للأعلى وإبقائه عند السطح؟", "مكبس هيدروليكي مساحة مكبسه الصغير 2 سم² والكبير 20 سم²، أثرت قوة 10 نيوتن على الصغير، فالقوة على الكبير:": "في المكبس الهيدروليكي الضغط متساوي على المكبسين: ق₁ ÷ م₁ = ق₂ ÷ م₂.\nومنها ق₂ = ق₁ × (م₂ ÷ م₁). احسب نسبة المساحتين أولاً (الكبير على الصغير)، ثم اضربها في القوة المؤثرة على المكبس الصغير. لا حاجة لتحويل الوحدات لأن المساحتين بنفس الوحدة.", "ضغط الماء (ث = 1000 كغم/م³) على عمق 2 م (جـ = 10 م/ث²) يساوي:": "استخدم قانون ضغط السائل: ض = ث × جـ × ع.\nعوّض الكثافة وتسارع الجاذبية والعمق بالقيم المعطاة بوحداتها (كغم/م³، م/ث²، م) وأجرِ الضرب لتحصل على الضغط بالباسكال. لاحظ أن السؤال يطلب ضغط الماء وحده.", "يُستخدم الزيت في المكبس الهيدروليكي وليس الهواء لأن:": "المكبس الهيدروليكي ينقل الضغط عبر مائع محبوس. فكّر في ما يحدث للغاز عندما نضغطه (هل يقلّ حجمه بسهولة؟) وما يحدث للسائل.\nاسأل: ما الصفة التي تجعل السائل أفضل في نقل القوة كاملة؟ وما الذي سيحدث لجزء من الجهد المبذول لو كان المائع قابلاً للانضغاط؟", "عدد أفوجادرو يساوي تقريباً:": "عدد أفوجادرو هو عدد الجسيمات (ذرات أو جزيئات أو أيونات) في مول واحد من أي مادة.\nيُكتب بالصيغة العلمية على شكل عدد مضروب في قوة للعدد 10، وهو عدد ضخم جداً. تذكّر القيمة وانتبه للأس الموجب الكبير، فبعض الخيارات تمثل ثوابت فيزيائية أخرى.", "وحدة الكتلة المولية:": "الكتلة المولية هي كتلة مول واحد من المادة. اكتب هذا التعريف على شكل نسبة: كتلة مقسومة على كمية المادة.\nالكتلة تُقاس بالغرام وكمية المادة تُقاس بالمول، فركّب الوحدة بوضع البسط والمقام في موضعيهما الصحيحين.", "حجم مول واحد من أي غاز في الظروف المعيارية STP:": "الحجم المولي هو الحجم الذي يشغله مول واحد من الغاز، وقد وجد العلماء أنه ثابت لكل الغازات تقريباً في الظروف المعيارية.\nتذكّر القيمة الشهيرة للحجم المولي بوحدة اللتر، وتحقّق من أنها تقع بين الأرقام التي تمثل حجماً صغيراً جداً وحجماً كبيراً جداً.", "الظروف المعيارية STP هي:": "الظروف المعيارية STP اتفاق بين العلماء على ضغط ودرجة حرارة محددين لتسهيل المقارنة بين الغازات.\nتذكّر أن درجة الحرارة هي درجة تجمد الماء، وأن الضغط هو الضغط الجوي المعتاد عند مستوى سطح البحر. ثم راجع كل خيار على حدة وتأكد من تطابق القيمتين معاً.", "عدد المولات يُحسب من القانون:": "انتبه إلى الوحدات: الكتلة تُقاس بالغرام، والكتلة المولية بوحدة غم/مول، والمطلوب عدد بوحدة مول.\nجرّب كل صيغة في الخيارات وانظر: أيّها تجعل وحدة الغرام تختفي فتبقى «مول» فقط؟ تذكّر أن (غم ÷ غم/مول) تعني ضرب الغرامات في مقلوب الكسر.", "الكتلة المولية لكربونات الكالسيوم CaCO₃ (Ca=40، C=12، O=16):": "الكتلة المولية للمركب = مجموع الكتل الذرية لكل الذرات الموجودة في صيغة جزيء المركب (أو وحدة صيغته).\nاقرأ الأرقام الصغيرة أسفل رمز كل عنصر لتعرف عدد ذراته، واضرب هذا العدد في كتلته الذرية، ثم اجمع النتائج وضع الوحدة غم/مول.", "كتلة مول واحد من جزيئات الأكسجين O₂ (O=16):": "الأكسجين الغازي يوجد على شكل جزيئات ثنائية الذرة، والرقم 2 في الصيغة O₂ يخبرك بعدد الذرات في الجزيء الواحد.\nالكتلة المولية للجزيء = مجموع كتل ذراته، وكتلة مول واحد بالغرام تساوي عددياً الكتلة المولية. احسب كتلة الذرتين معاً.", "في مول واحد من الجلوكوز C₆H₁₂O₆ يوجد من ذرات الكربون:": "الأرقام الصغيرة في الصيغة الكيميائية تدل على عدد الذرات في الجزيء الواحد، وهي نفسها عدد مولات الذرات في مول واحد من المركب.\nانظر إلى الرقم المكتوب بعد رمز الكربون في C₆H₁₂O₆ ولا تخلطه بأرقام العناصر الأخرى.", "عدد ذرات الحديد في 0.25 مول Fe يساوي تقريباً:": "عدد الجسيمات = عدد المولات × عدد أفوجادرو، وقيمة عدد أفوجادرو تقريباً 6.02 × 10²³ جسيم/مول.\nاضرب العدد العشري في 6.02 ثم عدّل الناتج ليصبح على صورة الصيغة العلمية (رقم بين 1 و10 مضروباً في قوة للعدد 10). انتبه أن تكون القوة صحيحة بعد التعديل.", "عدد مولات 10 غم من الكالسيوم (الكتلة الذرية 40):": "عدد المولات = الكتلة ÷ الكتلة المولية، والكتلة المولية للعنصر تساوي عددياً كتلته الذرية بوحدة غم/مول.\nعوّض الكتلة المعطاة والكتلة المولية في القانون، وتأكد أن الغرامات تختصر فتبقى وحدة المول.", "حجم 5 مول من غاز N₂ في STP:": "عند STP يشغل مول واحد من أي غاز حجماً ثابتاً مقداره 22.4 لتر، لذلك: الحجم = عدد المولات × 22.4 لتر/مول.\nعوّض عدد المولات المعطى في القانون، ولا تحتاج هنا إلى الكتلة المولية للنيتروجين.", "كتلة أسطوانة حجمها 10 لتر من غاز H₂ في STP (H=1) تساوي تقريباً:": "المسألة من خطوتين: حوّل الحجم إلى عدد مولات بالقسمة على الحجم المولي 22.4 لتر/مول عند STP، ثم حوّل المولات إلى كتلة بالضرب في الكتلة المولية.\nانتبه أن الهيدروجين الغازي جزيء ثنائي الذرة H₂، فاحسب كتلته المولية من ذرتين لا من ذرة واحدة.", "الكتلة المولية للشبة KAl(SO₄)₂·12H₂O (K=39، Al=27، S=32، O=16، H=1):": "اجمع الكتل الذرية لكل ذرات الصيغة، وانتبه لما يضاعفه الرقم: الرقم الصغير بعد القوس يضاعف كل ما داخل القوس.\nالنقطة قبل 12H₂O تعني جمع ماء التبلور، أي أن الرقم 12 يضاعف جزيء الماء كله (ذرتا هيدروجين وذرة أكسجين). احسب كتلة الماء وحدها أولاً ثم أضفها إلى كتلة الجزء الآخر.", "نزن المعادلة الكيميائية لتحقيق قانون:": "في أي تفاعل كيميائي تُعاد ترتيب الذرات فقط؛ لا تظهر ذرات جديدة ولا تختفي ذرات قديمة.\nوزن المعادلة يعني جعل عدد ذرات كل عنصر متساوياً في طرفيها. ابحث بين الخيارات عن القانون الذي يتحدث عن بقاء شيء ما ثابتاً قبل التفاعل وبعده.", "المعاملات في المعادلة الموزونة تمثل نسب:": "المعاملات هي الأعداد التي نكتبها أمام الصيغ، وتدل على عدد الجسيمات (جزيئات أو ذرات) التي تتفاعل وتنتج بنسبة معينة.\nالمول وحدة لعدّ الجسيمات (6.02 × 10²³ جسيماً). وفكّر: هل كتلة مول من مادة تساوي كتلة مول من مادة أخرى؟", "في المعادلة الموزونة للغازات تمثل المعاملات أيضاً نسب:": "في المعادلة الموزونة تدلّ المعاملات على نسبة عدد المولات (أو الجزيئات) بين المواد.\nوعند ثبات درجة الحرارة والضغط يقول قانون أفوجادرو إن الغازات المتساوية في الحجم تحتوي العدد نفسه من الجزيئات.\nاربط بين الفكرتين، ثم اسأل نفسك: أي كمية للغازات تتناسب مع عدد المولات؟", "في التفاعل 2H₂ + O₂ → 2H₂O، عدد مولات الماء الناتجة من 4 مول H₂:": "نسبة المولات تؤخذ من المعاملات في المعادلة الموزونة: كوّن نسبة بين معامل المادة المعطاة ومعامل المادة المطلوبة.\nاضرب عدد المولات المعطى في هذه النسبة بحيث تختصر وحدة المادة المعطاة. لا حاجة هنا إلى الكتل.", "أول خطوة في حل مسائل المعادلة الموزونة:": "كل حسابات المعادلة تعتمد على المعاملات لأننا نأخذ منها النسب المولية بين المواد.\nاسأل نفسك: هل يمكن الوثوق بنسبة مأخوذة من معادلة لم نتأكد من اتزانها؟ ما الذي يجب فعله قبل أي حساب كي لا تكون النسب خاطئة؟", "في التفاعل 2H₂ + O₂ → 2H₂O، مولات O₂ اللازمة لتفاعل 2 مول H₂:": "خذ المعاملين من المعادلة: معامل H₂ ومعامل O₂، وتذكّر أن غياب الرقم أمام الصيغة يعني أن معاملها 1.\nكوّن نسبة مولية (مولات O₂ لكل مولات H₂) ثم اضربها في المعطى 2 مول H₂.", "في التفاعل 5O₂ + 4NH₃ → 4NO + 6H₂O، كتلة O₂ اللازمة لتفاعل 17 غم من NH₃ (N=14، H=1، O=16):": "الحل على ثلاث خطوات: (1) حوّل كتلة NH₃ إلى مولات بقسمتها على كتلتها المولية (N + 3H). (2) استعمل النسبة المولية بين معاملي O₂ وNH₃ لإيجاد مولات O₂. (3) حوّل مولات O₂ إلى كتلة بالضرب في كتلتها المولية.\nانتبه أن O₂ جزيء ثنائي الذرة، وأن النسبة المولية تُقرأ من المعاملين 5 و4 مرتبين حسب المطلوب والمعطى.", "في التفاعل 2H₂ + O₂ → 2H₂O، حجم O₂ اللازم لتفاعل 10 لتر من H₂ (الظروف نفسها):": "المادتان غازان في الظروف نفسها من الضغط ودرجة الحرارة، فنسبة الحجوم تساوي نسبة المعاملات (نسبة المولات).\nلا حاجة إلى تحويل الحجم إلى مولات: اضرب الحجم المعطى مباشرة في نسبة معامل O₂ إلى معامل H₂.", "كتلة الماء الناتجة من تفاعل 2 مول من H₂ مع كمية كافية من O₂ (H₂O = 18 غم/مول):": "أولاً أوجد عدد مولات الماء الناتجة من النسبة بين معاملي H₂ وH₂O في المعادلة، فعبارة (كمية كافية من O₂) تعني أن H₂ هو الذي يحدد الناتج.\nثم حوّل المولات إلى كتلة بالضرب في الكتلة المولية للماء (18 غم/مول).", "الهيدروكربونات مركبات تتكون من:": "فكّك اسم المركب إلى جزأين: «هيدرو» و«كربون»؛ كل جزء منهما يدل على عنصر.\nانتبه إلى كلمة (فقط) في الخيارات، فالمركب الذي يحتوي عناصر إضافية لا ينطبق عليه تعريف الهيدروكربون.", "أهم مصدر للهيدروكربونات:": "الهيدروكربونات هي المادة الأولية لوقود السيارات والديزل وكثير من البلاستيك، وهذه المواد تُستخرج من باطن الأرض بعد أن تكوّنت من بقايا كائنات حية عبر ملايين السنين.\nاسأل: أي الخيارات خام يحتوي مركبات الكربون والهيدروجين بكثرة ويُكرَّر لنحصل على هذه الوقودات؟", "الصيغة العامة للألكانات:": "في الألكانات ترتبط كل ذرة كربون بأربع روابط أحادية. جرّب القانون على أبسط مثالين: الميثان CH₄ (n = 1) والإيثان C₂H₆ (n = 2).\nعوّض n في كل صيغة من الخيارات وقارن عدد الهيدروجين الناتج بعددها الحقيقي في المثالين.", "الصيغة العامة للألكينات:": "الألكين هيدروكربون يحتوي رابطة ثنائية واحدة بين ذرتي كربون، وهذه الرابطة تقلل عدد الهيدروجين مقارنة بالألكان نفسه.\nاختبر الصيغ على الإيثين C₂H₄ والبروبين C₃H₆: عوّض n بـ 2 ثم 3 وانظر أي صيغة تعطي عدد الهيدروجين الصحيح.", "أي متآصلات الكربون التالية الأكثر قساوة؟": "المتآصلات أشكال مختلفة للعنصر نفسه، تختلف في طريقة ترتيب الذرات وترابطها. تأكد أولاً أن كل خيار هو فعلاً شكل من أشكال الكربون.\nثم قارن بنيتها: شبكة ثلاثية الأبعاد ترتبط فيها كل ذرة بأربع ذرات، أم طبقات يسهل أن تنزلق فوق بعضها؟ والبنية الأكثر ترابطاً هي الأقسى.", "الألكانات هيدروكربونات مشبعة لأن روابطها:": "كلمة (مشبع) تعني أن كل ذرة كربون ارتبطت بأكبر عدد ممكن من الذرات الأخرى، فلا مجال لإضافة ذرات جديدة.\nفكّر: ماذا يحدث لعدد الذرات المرتبطة بالكربون إذا شاركت ذرتا كربون بأكثر من زوج من الإلكترونات؟ ثم حدّد نوع الروابط التي تحقق التشبع.", "المقطع «ان» في اسم «ميثان» يدل على أن المركب:": "أسماء عائلات الهيدروكربونات تتميز بنهايتها: يشترك الميثان والإيثان والبروبان في نهاية واحدة، وتختلف عنها نهاية الإيثين والإيثاين.\nاسأل: إلى أي عائلة ينتمي الميثان؟ ثم طابق نهاية اسمه مع العائلة المناسبة.", "التقطير التجزيئي لمكونات النفط يعتمد على اختلاف:": "التقطير التجزيئي يفصل مزيجاً من عشرات المركبات بتسخينه في برج، فتتبخر المكوّنات ثم تتكثف عند مستويات مختلفة.\nلا ينجح الفصل إلا إذا اختلفت المكوّنات في خاصية فيزيائية تحدد متى يتحول السائل منها إلى بخار ومتى يعود فيتكثف. ما هذه الخاصية؟", "أي نواتج تقطير النفط تخرج أولاً (الأقل درجة غليان)؟": "كلما كبر الجزيء (زاد عدد ذرات الكربون في سلسلته) زادت قوى التجاذب بين الجزيئات وارتفعت درجة غليانه.\nرتّب الخيارات من أصغر جزيئات إلى أكبرها، والجزء ذو الجزيئات الأصغر يتبخر عند أقل حرارة فيخرج من أعلى البرج أولاً. تذكّر أيضاً الحالة الفيزيائية لكل منها في درجة حرارة الغرفة.", "عند إضافة محلول البروم الأحمر إلى ألكين:": "اللون الأحمر لمحلول البروم سببه جزيئات البروم Br₂ الحرة في المحلول.\nالألكين يحتوي رابطة ثنائية تتفاعل بالإضافة مع Br₂، فتتحد ذرتا البروم بذرتي الكربون. فكّر: ماذا يحدث لجزيئات البروم الحرة بعد التفاعل، وكيف ينعكس ذلك على لون المحلول؟", "ألكان يحتوي 14 ذرة هيدروجين، فعدد ذرات الكربون فيه:": "الصيغة العامة للألكانات CₙH₂ₙ₊₂ تربط عدد ذرات الهيدروجين بعدد ذرات الكربون n.\nضع عدد الهيدروجين المعطى مكان 2n + 2 وحلّ المعادلة البسيطة لإيجاد n.", "عدد متشكلات البيوتان C₄H₁₀:": "المتشكلات مركبات لها الصيغة الجزيئية نفسها لكن ترتيب ذراتها مختلف.\nارسم هيكل الكربون الأربعة أولاً كسلسلة مستقيمة، ثم حاول رسم هيكل آخر بتفرع. انتبه: إذا أمكن الحصول على أحد الرسمين من الآخر بالدوران أو بقلب السلسلة فهما مركب واحد لا مركبان.", "التفاعل: بروبين + H₂ (بوجود Ni) → بروبان يسمى تفاعل:": "قارن بين المتفاعلات والناتج: ماذا حدث للرابطة الثنائية في البروبين، وما الذي دخل على الجزيء؟\nفرّق بين تفاعل تُستبدل فيه ذرة بذرة، وتفاعل تُضاف فيه ذرات إلى الجزيء من دون أن يخرج منه شيء، وبين الاحتراق مع الأكسجين وتكوين سلاسل طويلة من وحدات متكررة.", "المونومر المستخدم لتحضير البولي إيثيلين:": "المونومر هو الوحدة الصغيرة التي تتكرر وتتحد مع أمثالها لتكوّن البوليمر. بادئة (بولي) تعني (عدة)، وبقية الاسم تدل على الوحدة المتكررة.\nلكي تتصل المونومرات تحتاج إلى رابطة ثنائية تنفتح فتصل الجزيء بالجزيء التالي، فاسأل أي الخيارات هيدروكربون يحتوي رابطة ثنائية.", "أي المواد التالية بوليمر طبيعي؟": "البوليمر الطبيعي تصنعه الكائنات الحية (مثل النباتات والحيوانات) ويوجد في الطبيعة، أما البوليمر الصناعي فيُصنَّع في المصانع من مواد خام نفطية.\nاسأل نفسك عن كل خيار: هل هو مادة بلاستيكية مصنعة، أم مكوّن أساسي في جدران الخلايا النباتية؟", "التفرع في سلسلة الألكان يؤدي عادة إلى:": "قارن بين سلسلة مستقيمة وسلسلة متفرعة لها عدد الذرات نفسه: الأولى طويلة وممتدة والثانية أكثر تقارباً من الشكل الكروي.\nكلما قلّت مساحة التلامس بين الجزيئات المتجاورة ضعف التجاذب بينها، فاسأل كيف يؤثر ذلك في الحرارة اللازمة لفصل الجزيئات عن بعضها.", "ينص قانون حفظ الطاقة على أن الطاقة:": "فكّر في مثال: عند احتراق وقود تتحول الطاقة الكيميائية المخزنة فيه إلى حرارة وضوء.\nقارن مجموع الطاقة قبل التحول وبعده، واسأل: هل تغيّر المجموع أم تغير الشكل فقط؟ واختر العبارة التي تصف ذلك.", "إشارة ΔH في التفاعل الطارد للطاقة:": "ΔH = H(النواتج) − H(المتفاعلات). التفاعل الطارد يطلق طاقة إلى المحيط، فينقص المحتوى الحراري للمواد المتفاعلة.\nاسأل: إذا كان الناتج أقل طاقة من المتفاعلات، فهل الفرق (النواتج − المتفاعلات) أكبر من الصفر أم أصغر منه؟", "أي التفاعلات التالية ماص للطاقة؟": "التفاعل الماص يمتص طاقة من المحيط، فيحتاج إلى تسخين مستمر ليستمر، وإذا توقف التسخين توقف التفاعل.\nأما الطارد فيُطلق حرارة وقد يصاحبه لهب أو سخونة. اسأل عن كل خيار: هل يعطي حرارة أم يحتاج إليها؟", "حرارة التفاعل ΔH تساوي:": "ΔH تعبّر عن التغير في المحتوى الحراري، والتغير في أي كمية يُحسب دائماً بالنهائي ناقص الابتدائي (مثل تغير درجة الحرارة).\nحدّد ما الحالة النهائية وما الحالة الابتدائية في التفاعل الكيميائي، ثم طابقهما مع الخيارات.", "في المعادلة الحرارية للتفاعل الماص تُكتب الحرارة:": "عند كتابة معادلة حرارية نضع الحرارة في الجهة التي يظهر فيها دورها: الحرارة الناتجة تظهر مع المواد الناتجة، كما في مثال الكربون في السؤال 83.\nفي التفاعل الماص تُمتص الحرارة فتكون مثل مادة مستهلكة. في أي جهة تكتب المواد المستهلكة؟", "تفاعل Na مع الماء ΔH = −368.6 كيلو جول، والإشارة السالبة تعني أن التفاعل:": "الإشارة في ΔH تدل على اتجاه انتقال الطاقة، وهي مأخوذة من القانون: ΔH = H(النواتج) − H(المتفاعلات).\nإذا كانت قيمة ΔH سالبة فاسأل: هل المحتوى الحراري للنواتج أكبر أم أصغر من المتفاعلات؟ ثم هل ذلك يعني أن النظام امتص طاقة أم أطلقها؟", "في التفاعل الطارد يكون المحتوى الحراري للنواتج:": "في التفاعل الطارد تكون ΔH سالبة، وΔH = H(النواتج) − H(المتفاعلات).\nأو تخيل مخططاً للطاقة: النظام يطلق طاقة إلى المحيط، فينتقل من مستوى طاقة أعلى إلى مستوى طاقة آخر. حدّد أي الطرفين (المتفاعلات أم النواتج) يكون في المستوى الأعلى.", "C + O₂ → CO₂ + 394 كيلو جول. الطاقة الناتجة من احتراق 2 مول كربون:": "المعادلة تخبرك بالطاقة الناتجة عن كمية محددة من الكربون، وهي المعامل المكتوب أمام C في المعادلة.\nالطاقة الناتجة تتناسب طردياً مع عدد المولات المتفاعلة. قارن كمية الكربون في السؤال بتلك الكمية، وضاعف الطاقة بالنسبة نفسها.", "الطاقة الناتجة من احتراق 5 أطنان من الفحم (كربون صافٍ، C=12) وفق المعادلة السابقة تقريباً:": "هذه مسألة حرارة تفاعل: المعادلة السابقة تعطي الطاقة الناتجة عن احتراق كمية معلومة من الكربون (عدد مولات محدد في المعادلة)، ومنها تحصل على الطاقة لكل مول واحد.\nالخطوات: حوّل الكتلة من طن إلى غرام (الطن الواحد يساوي مليون غرام)، ثم احسب عدد المولات = الكتلة ÷ الكتلة المولية. بعدها اضرب عدد المولات في الطاقة الناتجة عن مول واحد من الكربون (انتبه لمعامل الكربون في المعادلة).\nأخيراً قارن رتبة الناتج (قوة العشرة) بالخيارات للتأكد من أنك لم تخطئ في تحويل الوحدات.", "أطول أطوار دورة الخلية هو:": "تتكون دورة الخلية من مرحلة إعداد تنمو فيها الخلية وتنسخ مادتها الوراثية وتجهّز نفسها، ومن مرحلة انقسام فعلي تنقسم فيها النواة ثم السيتوبلازم.\nاسأل نفسك: أي المرحلتين تقضي فيها الخلية معظم عمرها، وأيهما سريعة نسبياً؟\nثم صنّف كل خيار: هل هو طور من أطوار الانقسام أم اسم لمرحلة أخرى من الدورة؟", "يتضاعف DNA في الخلية خلال المرحلة:": "في دورة الخلية مراحل نمو ومرحلة للانقسام، ولكل حرف في أسمائها معنى باللغة الإنجليزية يدل على ما يحدث فيها.\nفكّر: متى يجب أن تحصل الخلية على نسخة ثانية كاملة من مادتها الوراثية، قبل أن تبدأ الانقسام أم بعده؟ وما الذي يضمن أن تأخذ كل خلية بنت نسخة كاملة؟", "من الخلايا التي تدخل طور السكون الدائم G0:": "طور G0 هو خروج الخلية من الدورة فلا تنقسم، وقد يكون مؤقتاً أو دائماً.\nالخلايا التي يتلف منها الكثير وتحتاج إلى تعويض مستمر يجب أن تواصل الانقسام. أما الخلايا شديدة التخصص أو التي فقدت النواة فلا تستطيع العودة إلى الانقسام.\nاسأل نفسك: أي الخيارات يصف خلايا فقدت قدرتها على الانقسام نهائياً؟", "يحدث الانقسام المتساوي في الخلايا:": "الانقسام المتساوي يعطي خلايا مطابقة للخلية الأم، ووظيفته النمو وتعويض التالف وإصلاح الأنسجة.\nفكّر في الخلايا التي تبني جسمك وتتجدد فيه، وقارنها بالخلايا التي تُنتج الأمشاج بنوع آخر من الانقسام يقلل عدد الكروموسومات.", "تصطف الكروموسومات في وسط الخلية في الطور:": "أطوار الانقسام المتساوي بالترتيب: التمهيدي (تكثف الكروموسومات)، ثم طور تصطف فيه الكروموسومات، ثم طور تنفصل فيه، ثم طور تتكون فيه نواتان.\nاسم الطور يرتبط أحياناً بموضع الحدث؛ فكّر في خط الاستواء الذي يقسم الكرة الأرضية إلى نصفين، وفي منتصف الخلية حيث تصطف الكروموسومات.", "تنفصل الكروماتيدات الشقيقة نحو القطبين في الطور:": "بعد أن تصطف الكروموسومات في وسط الخلية تنقسم المراكز (السنترومير) وتصبح الكروماتيدات الشقيقة كروموسومات مستقلة.\nتقصر خيوط المغزل فتسحب كل كروماتيد نحو قطب مختلف.\nحدّد أي الأطوار يأتي بعد الاصطفاف مباشرة، وانتبه إلى أن الانقسام المتساوي ليس كل ما تمر به الخلية في دورتها.", "ناتج الانقسام المتساوي لخلية أم:": "قبل الانقسام المتساوي تُضاعف الخلية مادتها الوراثية مرة واحدة، ثم تنقسم مرة واحدة فقط.\nفكّر: كم خلية تنتج عن انقسام واحد؟ وكيف يكون عدد الكروموسومات والمعلومات الوراثية فيها مقارنة بالأم؟ تذكّر أن هدف هذا الانقسام النمو والتعويض لا التنوع.", "دور السايكلين ونقاط التحكم في دورة الخلية:": "السايكلينات بروتينات يرتفع تركيزها وينخفض في أوقات محددة من الدورة، فتنشّط إنزيمات تدفع الخلية للانتقال من مرحلة إلى التي تليها.\nأما نقاط التحكم فتفحص الخلية (سلامة DNA، الحجم، اكتمال التضاعف) قبل السماح لها بالمتابعة، تماماً كإشارة المرور.\nفما الوظيفة العامة التي تجمع بين الاثنين؟", "الأورام تنتج عن انقسام خلايا:": "في الحالة الطبيعية تنقسم الخلايا تحت إشراف السايكلينات ونقاط التحكم، فتتوقف إذا وُجد خلل أو إذا كان العدد كافياً.\nالورم يتكوّن عندما يختل هذا الإشراف بسبب طفرات في الجينات المنظمة للدورة.\nاختر الوصف الذي يعبّر عن غياب الضبط، وليس عن وجوده.", "يحدث الانقسام المنصف في الخلايا:": "الانقسام المنصف وظيفته إنتاج الغاميتات (الأمشاج) التي تُستعمل في التكاثر، ويتم في الغدد التناسلية (الخصيتين والمبيضين).\nفكّر في الخلايا التي تحمل مهمة التكاثر، وقارنها بالخلايا التي تؤدي وظائف أخرى كالتوصيل العصبي والحركة.", "عدد الخلايا الناتجة من الانقسام المنصف لخلية أم واحدة:": "الانقسام المنصف تسبقه مرحلة تضاعف واحدة للمادة الوراثية، ثم تتبعه مرحلتا انقسام متتاليتان: المنصف الأول ثم المنصف الثاني.\nتتبّع عدد الخلايا: كم خلية تنتج بعد الانقسام الأول؟ ثم ماذا يحدث لكل واحدة منها في الانقسام الثاني؟ طبّق ذلك وسيظهر لك العدد النهائي.", "الخلايا الناتجة من الانقسام المنصف عدد كروموسوماتها:": "فكّر في الإخصاب: عندما يندمج غاميتان لتكوين الزايجوت، ماذا يحدث لعدد الكروموسومات؟\nولكي يبقى عدد كروموسومات النوع ثابتاً من جيل إلى جيل، كم يجب أن يحمل كل غاميت منها مقارنةً بالخلية الجسمية؟\nتذكّر أن الانقسام المنصف الأول يفصل الكروموسومات المتماثلة عن بعضها.", "يحدث العبور في الطور:": "العبور هو تبادل أجزاء بين كروماتيدات غير شقيقة من كروموسومين متماثلين، ولذلك لا يحدث إلا إذا اقترب الكروموسومان المتماثلان وتزاوجا معاً.\nفي أي انقسام (الأول أم الثاني) تكون الكروموسومات المتماثلة مجتمعة؟ وفي أي طور منه يحدث هذا الاقتران؟\nانتبه إلى رقم الانقسام في كل خيار.", "الخلية الأم الواحدة في الذكر والأنثى على الترتيب تعطي:": "قارن بين تكوّن الحيوانات المنوية وتكوّن البويضات: كم خلية ناضجة تنتج عن كل خلية أم؟ وكيف يُقسَّم السيتوبلازم في كل حالة؟\nانتبه إلى أن السؤال يطلب الترتيب: الذكر أولاً ثم الأنثى.", "يكتمل الانقسام المنصف الثاني في البويضة:": "تُطلق البويضة من المبيض في مرحلة متوقفة من الانقسام المنصف، ثم تنتظر حدثاً يحفزها على إكمال الانقسام الثاني.\nاسأل نفسك: ما الحدث الذي يجعل البويضة تكمل انقسامها؟ ومتى يحدث بالنسبة للتبويض؟", "الترتيب الصحيح لتكوين الحيوانات المنوية:": "تكوين الحيوانات المنوية يسير بالترتيب: خلية منوية أولية تخضع للانقسام المنصف الأول فتعطي خلايا ثانوية، وتخضع الثانوية للانقسام المنصف الثاني فتعطي خلايا تسمى الطلائع، ثم تتمايز الطلائع إلى حيوانات منوية بذيل ورأس.\nتحقق من خيار يوافق هذا التسلسل ويكون فيه عدد الكروموسومات في كل مرحلة صحيحاً (2n ثم n).", "تعطي الخلية الأم بويضة واحدة فقط لأن:": "البويضة تحتاج إلى مخزون كبير من السيتوبلازم والغذاء لتغذية الجنين في بداياته.\nفكّر كيف يُقسَّم السيتوبلازم عند انقسام الخلية الأم في الأنثى مقارنة بالذكر، وماذا يحدث للخلايا الصغيرة الناتجة؟\nاختر التفسير الذي يربط بين الشكل الذي ينقسم به السيتوبلازم وبين عدد البويضات الناتجة.", "من أهمية الانقسام المنصف:": "فكّر في التكاثر الجنسي: عند اندماج الغاميتين، ماذا يحدث لعدد الكروموسومات لو لم يُخفَّض في الغاميتات؟\nوتذكّر أن العبور وتوزيع الكروموسومات المتماثلة عشوائياً يؤديان إلى تراكيب وراثية جديدة.\nاستبعد أي عبارة تصف وظائف الانقسام المتساوي كالنمو والإصلاح أو إنتاج نسخ مطابقة.", "عدد الأنسجة الرئيسة في جسم الإنسان:": "تُصنَّف الأنسجة إلى مجموعات كبرى بحسب شكل الخلايا ووظيفتها، لا بحسب العضو الموجود فيه.\nاسترجع هذا التصنيف من درسك: اذكر كل مجموعة مع مثال عليها، ثم عدّها.", "النسيج الذي تتراص خلاياه ووظيفته الحماية والامتصاص والإفراز:": "فكّر في الأسطح التي تحتاج إلى حماية وامتصاص وإفراز: الجلد من الخارج، وبطانة الأمعاء، والغدد.\nالنسيج المطلوب تكون خلاياه متلاصقة ومادته بين الخلوية قليلة جداً. أي أنواع الأنسجة يغطي الأسطح ويبطّن التجاويف؟", "المستوى التنظيمي الذي يلي النسيج مباشرة:": "التنظيم في جسم الكائن الحي يبدأ من الأصغر إلى الأكبر: الخلية ثم النسيج ثم مستوى ثالث ثم الجهاز ثم الكائن الحي.\nالمستوى المطلوب هو الذي تتعاون فيه عدة أنسجة مختلفة لتؤدي وظيفة محددة، كالقلب والمعدة.", "النسيج العضلي الذي يوجد في القلب فقط هو:": "العضلات في الجسم ثلاثة أنواع، ويُسمّى بعضها بحسب مكانه أو شكله أو عمله.\nاسأل نفسك: أي نوع منها لا يوجد إلا في عضو واحد هو القلب؟\nانتبه إلى أن بعض العضلات لها أكثر من اسم يُستعمل في الكتب.", "أي مما يلي من أنواع النسيج الضام؟": "النسيج الضام يربط الأنسجة ويدعمها، ويتميز بأن خلاياه متباعدة وتوجد في مادة بين خلوية وفيرة، قد تكون صلبة أو هلامية أو سائلة.\nاختر الخيار الذي تنتمي كل عناصره إلى هذه الصفة، وانتبه إلى أن الخيار الصحيح تنطبق عليه الصفة في كل ما يذكره لا في بعضه.", "الوحدة البنائية والوظيفية للنسيج العصبي:": "لكل نسيج أو عضو وحدة بنائية ووظيفية: فهي أصغر جزء يقوم بوظيفة النسيج كاملة.\nالنسيج العصبي وظيفته استقبال السيالات ونقلها، فما الخلية المتخصصة في ذلك؟ وانتبه إلى أن بعض الخيارات تخص الدم أو الكلية.", "من صفات النسيج الطلائي:": "للنسيج الطلائي صفات يمكنك التحقق منها بأسئلة: كيف تتراص خلاياه؟ وما مقدار المادة بين الخلوية؟ وهل تخترقه الأوعية الدموية أم يتغذى بالانتشار من النسيج الذي تحته؟ وعلى ماذا يستند؟ وما قدرته على التجدد؟\nأجب عن هذه الأسئلة ثم قارن كل عبارة بإجاباتك.", "الألياف الثلاثة في النسيج الضام هي:": "الألياف جزء من المادة بين الخلوية في النسيج الضام، ولها وظائف: أنواع تمنح القوة وتحمل الشد، وأنواع تمنح المرونة، وأنواع دقيقة متفرعة تشكل شبكة دعم.\nاسترجع أسماء هذه الألياف من درسك، وانتبه إلى أن الخيار المطلوب يتحدث عن النسيج الضام بالتحديد.", "أي أنواع العضلات التالية لا إرادية وتحيط بالأعضاء الجوفاء؟": "ضع شرطين للعضلة المطلوبة: أن تكون لا إرادية، وأن تحيط بجدران الأعضاء الجوفاء مثل الأمعاء والأوعية الدموية والمثانة.\nثم تذكّر أنواع العضلات الثلاثة وخصائص كل نوع من حيث الإرادة والموقع، واختر النوع الذي يجمع الشرطين.", "العضو الذي ينتج الحيوانات المنوية:": "الجهاز التناسلي الذكري فيه عضو ينتج الغاميتات وأعضاء تنقلها أو تخزنها أو تضيف إليها إفرازات.\nاسأل نفسك: أي العضو هو الغدة التناسلية الذكرية التي تُصنَّع فيها الحيوانات المنوية داخل الأنابيب المنوية؟", "الهرمون الذكري الذي تفرزه الخصيتان:": "الغدد التناسلية تنتج الغاميتات وتفرز هرمونات جنسية تظهر الصفات الجنسية الثانوية.\nفكّر: ما الهرمون المسؤول عن الصفات الذكرية كخشونة الصوت ونمو الشعر والعضلات؟ وما أنواع الهرمونات التي ينتجها المبيض؟", "يحدث الإخصاب غالباً في:": "تتبّع رحلة البويضة بعد التبويض: تلتقطها نهاية قناة البيض وتدفعها الأهداب نحو الرحم، وهي تعيش وقتاً قصيراً بعد خروجها.\nوتتبّع رحلة الحيوانات المنوية وهي تصعد من المهبل عبر الرحم.\nفأين يلتقيان في الغالب؟ وانتبه إلى أن الإخصاب غير الانغراس.", "تفرز الخلايا البينية (خلايا ليديج) في الخصية:": "تقع الخلايا البينية في الفراغات بين الأنابيب المنوية في الخصية، وهي خلايا صماء وظيفتها إفراز هرمون.\nأما الأنابيب المنوية نفسها فهي مكان تكوّن الحيوانات المنوية.\nاسأل نفسك: ماذا تفرز الخلايا الصماء في الخصية؟", "تحتوي القطعة الوسطى في الحيوان المنوي على:": "الحيوان المنوي له رأس فيه النواة والأكروسوم، وقطعة وسطى، وذيل سوطي يسبح به.\nالسباحة تحتاج إلى طاقة كبيرة. ما العضية المسؤولة عن إنتاج الطاقة في الخلية؟ وفي أي جزء من الحيوان المنوي تتجمع؟", "عدد كروموسومات الزايجوت البشري:": "تذكّر عدد الكروموسومات في الخلية الجسمية البشرية، ثم عدد ما تحمله كل غاميت منها.\nالزايجوت ينشأ من اندماج غاميتين، فاجمع ما يحمله كل منهما، وقارن ذلك بعدد الكروموسومات في خلايا الجسم.", "أي الهرمونات يحفز التبويض؟": "في دورة المبيض تعمل هرمونات من الغدة النخامية وأخرى من المبيض، ولكل منها دور: واحد ينمّي الجريب، وآخر يسبب انفجار الجريب وإطلاق البويضة، وآخر يهيئ بطانة الرحم ويحافظ عليها.\nاستحضر أسماء هذه الهرمونات ووظيفة كل منها، ثم اختر الهرمون المسؤول عن إطلاق البويضة.", "التوائم المتطابقة تنتج من:": "التوأمان المتطابقان يتشابهان في المادة الوراثية تشابهاً كاملاً.\nفكّر: كم بويضة وكم حيواناً منوياً يشاركون في تكوين زايجوت واحد؟ ولو انقسم الجنين المبكر إلى جنينين، فمن أين تأتي المادة الوراثية لكل منهما؟\nقارن ذلك بحالة التوأمين غير المتطابقين.", "يكتمل نضج الحيوانات المنوية وتُخزَّن في:": "مسار الحيوانات المنوية: تتكون في الأنابيب المنوية، ثم تنتقل إلى قناة ملتفة ملتصقة بالخصية تنضج فيها وتكتسب الحركة وتُخزَّن، ثم إلى الوعاء الناقل.\nاستحضر أسماء هذه التراكيب، وتذكّر أن غدداً مثل البروستات تضيف إفرازات فقط ولا تُخزّن الحيوانات المنوية.", "الوحدة التركيبية والوظيفية في الكلية:": "وحدة التركيب والوظيفة هي أصغر جزء يؤدي وظيفة العضو كاملة.\nفي الكلية تبدأ الوظيفة بترشيح الدم ثم تتم معالجة الراشح في أنبوب طويل. فما اسم التركيب الذي يجمع الجزأين معاً؟ وانتبه إلى كلمة فقط في بعض الخيارات.", "العضو الذي يخزن البول مؤقتاً:": "تتبّع مسار البول بالترتيب: عضو يكوّن البول، ثم قناتان تنقلانه، ثم عضو يتسع ليتجمع فيه، ثم قناة تطرحه إلى الخارج.\nاسأل نفسك: أي عضو جداره مرن يتسع ويمتلئ ثم يفرغ عند التبول؟", "وظيفة الحالبين:": "تذكّر مسار البول بالترتيب من مكان تكوينه إلى طرحه، وحدّد موقع الحالبين فيه.\nما العضو الذي يسبقهما وما العضو الذي يليهما؟ والقناة التي تصل بين عضوين وظيفتها النقل لا التخزين ولا التصفية.", "يحدث الترشيح في:": "الترشيح أول خطوة في تكوين البول، ويتم بضغط الدم عبر جدران شعيرات دموية في بداية النفرون، فتخرج الماء والمواد الصغيرة إلى حيز يحيط بها.\nأما إعادة الامتصاص فتحدث لاحقاً في الأنابيب.\nحدّد التركيب الذي توجد فيه هذه الشعيرات المحاطة بالمحفظة.", "تُعاد من الراشح في الكلية نسبة تقارب:": "تترشح من الدم في الكلية كمية كبيرة جداً من السائل كل يوم، أما البول الذي يطرحه الجسم فقليل جداً بالمقارنة.\nما الذي يحدث إذاً لمعظم الراشح؟ لأن الجسم لا يستطيع أن يفقد الماء والجلوكوز والأملاح النافعة.\nقدّر النسبة بناءً على هذه المقارنة.", "خطوات تكوين البول بالترتيب:": "لكل عملية في تكوين البول دور واضح: الترشيح يدفع الماء والمواد الصغيرة من الدم إلى النفرون، وإعادة الامتصاص تُرجع المواد النافعة من النبيب إلى الدم، والإفراز ينقل مواد زائدة من الدم إلى النبيب.\nفكّر منطقياً: أي عملية تحتاج أولاً إلى وجود سائل داخل النبيب لتعمل عليه؟ وأي عملية تُكمل التنقية في النهاية؟", "من طرق علاج الفشل الكلوي:": "الفشل الكلوي يعني أن الكلى فقدت قدرتها على تنقية الدم من الفضلات والماء الزائد.\nالعلاج الصحيح إما أن يقوم بعمل الكلية خارج الجسم، أو أن يستبدل العضو التالف نفسه. اسأل نفسك عن كل خيار: هل يعالج وظيفة الترشيح المفقودة فعلاً؟", "السبب الرئيس لحصى الكلية والوقاية منها:": "حصى الكلية بلورات تتكوّن عندما تتركّز أملاح معدنية في البول فتترسب وتتجمع.\nابحث في كتابك عن نوع الأملاح الأكثر ارتباطاً بتكوّن الحصى. ثم فكّر في طريقة الوقاية: ما الذي يجعل البول أقل تركيزاً فتقلّ فرصة ترسّب الأملاح؟", "يأتي حمض البوليك في البول من أيض:": "حمض البوليك فضلة نيتروجينية، أي أن ذرات النيتروجين موجودة في تركيبه.\nإذن لا بد أنه ينتج من تكسير جزيئات حيوية تحتوي النيتروجين في بنيتها (مثل القواعد النيتروجينية). تذكّر أن بعض الجزيئات الحيوية تتكوّن من الكربون والهيدروجين والأكسجين فقط.", "عدد المجالات في التصنيف الحديث:": "المجال هو أعلى مستوى في التصنيف الحديث، ويقع فوق المملكة. اعتمد العلماء في تحديد المجالات على الفروق في rRNA وفي تركيب الخلية.\nتذكّر أن الكائنات بدائية النواة لم تعد تُعدّ مجموعة واحدة بعد دراسة rRNA، وأن للكائنات حقيقية النواة مجالها الخاص. عدّ المجالات التي يذكرها كتابك.", "عدد الممالك في التصنيف الحديث:": "المملكة مستوى أصغر من المجال، فبعض المجالات تضم مملكة واحدة وبعضها يضم عدة ممالك.\nالمجال الذي تنتمي إليه الكائنات حقيقية النواة يضم الأوليات والفطريات والنباتات والحيوانات. اجمع هذه مع ممالك المجالين الآخرين كما في كتابك.", "يتكون الاسم العلمي من:": "نظام التسمية الذي وضعه لينيوس يسمى التسمية الثنائية، أي أن الاسم يتكون من كلمتين لاتينيتين.\nالكلمة الأولى تبدأ بحرف كبير وتدل على مجموعة أوسع، والثانية تبدأ بحرف صغير وتحدد الكائن بدقة. راجع مستويات التصنيف وانظر أي مستويين يمثلان هاتين الكلمتين.", "الوحدة الأساسية في التصنيف:": "الوحدة الأساسية في التصنيف هي المستوى الذي يُعرَّف بأن أفراده قادرون على التزاوج فيما بينهم وإنتاج نسل خصب.\nطبّق هذا التعريف على مستويات التصنيف المذكورة: أيها يُعرَّف بهذه الطريقة؟", "الاسم العلمي للقط المنزلي:": "الاسم العلمي يتكوّن من الجنس (بحرف كبير) ثم النوع (بحرف صغير)، وهو لاتيني الأصل.\nكل خيار هو اسم كائن مختلف. اربط اسم الجنس بما تعرفه عن الكائن: القطط تنتمي إلى عائلة السنوريات اللاحمة، وكل جنس يضم أنواعاً متقاربة في صفاتها.", "أهمية الاسم العلمي أنه:": "فكّر في مشكلة الأسماء الشائعة: الحيوان نفسه قد يُسمّى بأسماء مختلفة في بلدان ولغات مختلفة، وقد يُطلق الاسم نفسه على كائنين مختلفين.\nالاسم العلمي وُضع ليحلّ هذه المشكلة. اسأل نفسك أي خيار يصف ميزة تجعل العلماء في العالم يفهمون الكائن نفسه من الاسم وحده.", "الترتيب الصحيح لمستويات التصنيف من الأكبر إلى الأصغر:": "ابدأ من الطرفين: حدّد أوسع مستوى في التصنيف الحديث وهو الذي يضم أكبر عدد من الكائنات، ثم حدّد أدق مستوى.\nرتّب الباقي بحيث يقلّ عدد الكائنات في المجموعة كلما نزلت: الجنس يضم أنواعاً، والعائلة تضم أجناساً، وهكذا. اختر الخيار الذي يتبع هذا التدرج كاملاً.", "البغل ليس نوعاً مستقلاً لأنه:": "تعريف النوع: مجموعة من الكائنات تتزاوج فيما بينها وتنتج نسلاً قادراً هو نفسه على التكاثر.\nالبغل ناتج عن تزاوج كائنين من نوعين مختلفين. اسأل نفسك: ماذا يحدث لقدرة البغل على التكاثر، وكيف ينعكس ذلك على تعريف النوع؟", "التصنيف الجيني يعتمد على:": "التصنيف الجيني يقارن الكائنات على مستوى جزيئات الوراثة، فكلما تشابهت المعلومات الوراثية زادت القرابة بين الكائنين.\nفكّر: أي الخيارات تقيس شيئاً داخل الجزيء الوراثي نفسه، وأيها يعتمد على ما نراه من الخارج أو على بيئة الكائن؟", "كم يساوي 1 كيلومتر بالمتر؟": "البادئة كيلو معناها مضاعف ثابت للوحدة الأساسية، كما في الكيلوغرام مع الغرام.\nارجع إلى جدول البوادئ واكتب قيمة كيلو، ثم عوّض: كم متراً في كيلومتر واحد؟", "أي أداة تستخدم لقياس قطر سلك رفيع بدقة عالية جداً؟": "دقة الأداة تتحدد بأصغر تدريج تستطيع قراءته، وقطر السلك الرفيع قد يكون أجزاء قليلة من الملّيمتر.\nقارن أصغر تدريج في كل أداة مذكورة، وتذكّر أن الأداة المصممة لهذا الغرض تعتمد على برغي دقيق الخطوة يُدار لإطباق فكّيها على الجسم.", "رمز البادئة «ميلي» هو:": "رموز البوادئ حساسة لحالة الحرف: الرمز الصغير والرمز الكبير يعنيان بادئتين مختلفتين جداً.\nملّي تعني جزءاً من ألف من الوحدة. راجع جدول البوادئ في كتابك وانتبه إلى حالة الحرف عند مطابقة الرمز.", "5 سم تساوي كم متراً؟": "السنتي تعني جزءاً من مئة من المتر، أي أن المتر الواحد يحوي عدداً معلوماً من السنتيمترات.\nعند التحويل من وحدة أصغر إلى أكبر نقسم على عدد الوحدات الصغيرة في الكبيرة. وللتحقق: 5 سم أقل من متر، فيجب أن تكون النتيجة أقل من واحد.", "الورنية تستخدم لقياس:": "تخيّل شكل الورنية: لها فكّان قابلان للانزلاق وساق رفيعة تبرز من طرفها.\nفكّر ماذا تقيس بكل جزء منها، ثم اختر الخيار الذي يجمع استعمالاتها كاملةً دون أن يخرج عن نوع الكمية التي تقيسها.", "القيمة 10⁻⁶ تمثل البادئة:": "البوادئ تُرتّب بأسس تتغيّر بخطوات من ثلاث مراتب: ملّي تعني 10⁻³، ثم تأتي البوادئ الأصغر بعدها تباعاً.\nضع البوادئ بالترتيب من الأكبر إلى الأصغر وحدّد أيها يقابل الأس -6 في جدول البوادئ.", "قطر خلية 20 μm، فكم يساوي بالمتر؟": "ابدأ بمعنى البادئة ميكرو (μ): اكتب قيمتها بالصيغة العلمية 10 أس عدد سالب.\nاضرب العدد 20 في هذه القيمة، ثم اكتب 20 على صورة (عدد بين 1 و10) × 10 أس، وادمج الأسّين بقانون ضرب الأسس. قارن الصيغة التي حصلت عليها بالخيارات.", "في الميكرومتر: التدريج الطولي 5.5 ملم والدائري 28 قسماً (كل قسم 0.01 ملم). القراءة:": "قراءة الميكرومتر = قراءة التدريج الطولي + (قراءة التدريج الدائري).\nقراءة التدريج الدائري = عدد الأقسام × قيمة القسم الواحد بالملّيمتر. احسب هذا الجزء أولاً بعناية في مرتبته العشرية، ثم أضفه إلى القراءة الطولية.", "السرعة 72 km/h تساوي بوحدة m/s:": "للتحويل نغيّر الوحدتين معاً: الكيلومتر إلى متر، والساعة إلى ثانية.\nتذكّر أن الكيلومتر الواحد فيه 1000 متر، وأن الساعة الواحدة فيها 60 دقيقة في كل دقيقة 60 ثانية. اضرب في عدد الأمتار واقسم على عدد الثواني.", "ما رمز عنصر الصوديوم؟": "رمز العنصر يتكوّن من حرف أو حرفين: الأول كبير والثاني صغير.\nبعض الرموز لا تُشتق من الاسم العربي أو الإنجليزي بل من الاسم اللاتيني القديم، مثل Fe للحديد من ferrum. ابحث عن الاسم اللاتيني للصوديوم، واستخرج منه الرمز.", "العناصر في المجموعة الواحدة في الجدول الدوري تقع في:": "الجدول الدوري منظّم في اتجاهين: أفقي ورأسي، ولكل منهما اسم: دورة أو مجموعة.\nالعناصر في المجموعة الواحدة تتشابه في عدد إلكترونات مستوى الطاقة الخارجي، فتتشابه خواصها الكيميائية. اسأل: في أي الاتجاهين يتكرر هذا التشابه؟", "أي مما يلي غاز نبيل؟": "الغازات النبيلة تقع في المجموعة الأخيرة من الجدول (المجموعة 18)، وهي غازات خاملة لأن مستوى طاقتها الخارجي ممتلئ.\nحدّد موقع كل عنصر من الخيارات في الجدول الدوري، واختر العنصر الذي يقع في تلك المجموعة.", "العدد الذري يمثل عدد:": "العدد الذري هو ما يحدد هوية العنصر، ويُكتب عادةً أسفل رمزه.\nفكّر في الجسيم الذي لو تغيّر عدده تغيّر العنصر نفسه، بينما نظائر العنصر الواحد تختلف في جسيم آخر موجود في النواة.", "فلز من المجموعة IA يتفاعل بشدة مع الماء:": "فلزات المجموعة IA (القلويات) نشيطة جداً، تتفاعل مع الماء بعنف وتنتج غاز الهيدروجين ومحلولاً قاعدياً، ويزداد نشاطها كلما نزلنا في المجموعة.\nحدّد موقع كل عنصر في الجدول الدوري. المطلوب عنصر فلزي يقع في المجموعة IA.", "عند تفاعل CaCO₃ مع HCl يتصاعد غاز:": "الكربونات تتفاعل مع الحموض وفق القاعدة: كربونات + حمض ← ملح + ماء + غاز.\nاكتب المعادلة العامة وطبّقها على CaCO₃ وHCl. تذكّر أن هذا الغاز يعكّر ماء الجير، وهو الاختبار المعروف للكشف عنه.", "كم مولاً من HCl يلزم للتفاعل مع مول واحد من CaCO₃؟": "اكتب معادلة التفاعل: CaCO₃ + HCl ← CaCl₂ + H₂O + CO₂، ثم زنها.\nابدأ بذرات الكلور: كم ذرة منها في المواد الناتجة؟ ومنها تحدد معامل HCl، ثم تحقق من توازن H وO. النسبة بين المعاملين هي النسبة المولية.", "لون الراسب الناتج من تفاعل Pb(NO₃)₂ مع KI:": "هذا تفاعل تبادل مزدوج: يتبادل المركبان الأيونات، فيتحد الرصاص مع أيون اليوديد ويتحد البوتاسيوم مع أيون النترات.\nاكتب صيغة الناتج الذي يرسب مستعيناً بقواعد الذوبان، ثم تذكّر لون هذا الراسب المميز الذي قد تكون رأيته في المختبر.", "نوع التفاعل Ca + 2H₂O → Ca(OH)₂ + H₂ هو:": "صنّف التفاعل بمقارنة المتفاعلات بالنواتج: كم مادة في كل جانب؟ وهل يوجد عنصر منفرد في المتفاعلات وعنصر منفرد في النواتج؟\nفي الإحلال البسيط يحل عنصر منفرد محل عنصر آخر في مركب، ويظهر عنصر جديد منفرد. طبّق ذلك على الكالسيوم والماء.", "العضية المسؤولة عن إنتاج الطاقة ATP:": "ATP هي عملة الطاقة في الخلية، وتُنتج معظمها في مراحل التنفس الخلوي الهوائي.\nابحث عن العضية ذات الغشاءين التي يلتف غشاؤها الداخلي في طيّات، وهي موضع هذا التفاعل.", "العضية التي تحتوي على المادة الوراثية:": "المادة الوراثية DNA في الخلايا حقيقية النواة محفوظة داخل عضية محاطة بغشاء، وهي مركز التحكم في الخلية.\nفكّر في العضية التي تصدر الأوامر لبناء البروتينات وتنظّم نشاط الخلية، وقارنها بوظائف العضيات الأخرى.", "الجدار الخلوي يوجد في الخلايا:": "الجدار الخلوي طبقة صلبة تقع خارج الغشاء الخلوي، تعطي الخلية شكلها وتدعمها.\nقارن بين الخلية النباتية والخلية الحيوانية: أي التراكيب ينفرد بها نوع منهما؟ ثم فكّر في المادة التي يتكوّن منها الجدار.", "أي عضية تعتبر مصنع البروتين؟": "بناء البروتين (الترجمة) يحدث عندما تُقرأ شيفرة mRNA وتُربط الأحماض الأمينية في سلسلة واحدة.\nابحث عن العضية الصغيرة المكوّنة من rRNA وبروتينات التي تقوم بهذا العمل، ولا تخلط بينها وبين عضيات وظيفتها الهضم أو إنتاج الطاقة أو الانقسام.", "المجهر الذي يعطي صورة ثلاثية الأبعاد للعينات الكبيرة نسبياً:": "الصورة المجسّمة تنتج عن النظر إلى الجسم من زاويتين مختلفتين قليلاً، وهو ما يتيحه مجهر له عينيتان، ويعتمد على الضوء المنعكس عن سطح الجسم.\nهذا النوع يفحص أجساماً كاملة وسميكة بتكبير منخفض، بخلاف المجهر الذي يمرّر الضوء عبر شريحة رقيقة جداً. اربط ذلك بأنواع المجاهر في الخيارات.", "يتكون كل مريكز من:": "المريكز تركيب أسطواني صغير يشارك في تكوين خيوط المغزل أثناء الانقسام، ويتألف من أنيبيبات دقيقة مرتبة في مجموعات متكررة حول محيطه.\nارجع إلى الرسم المقطعي في كتابك: كم مجموعة حول المحيط؟ وكم أنيبيباً في كل مجموعة؟ تحقق أن الخيار الذي تختاره يطابق الترتيب كاملاً.", "مجهر عدسته العينية 10× والشيئية 40×، التكبير الكلي:": "التكبير الكلي للمجهر = تكبير العدسة العينية × تكبير العدسة الشيئية.\nاكتب القيمتين من السؤال واضربهما معاً. تذكّر أن العدسة العينية هي التي تنظر من خلالها، وأن الشيئية قريبة من الشريحة.", "الفرق في السكر بين DNA وRNA:": "الحرف الأول من اسم كل حمض نووي يدل على نوع السكر الخماسي فيه، فتأمّل الاسمين كاملين: ديوكسي ريبو نيوكلييك أسيد، وريبو نيوكلييك أسيد.\nالبادئة ديوكسي تعني منقوص الأكسجين. اربط كل اسم بنوع السكر في حمضه، ثم طابق ذلك مع الخيارات.", "الترتيب الصحيح لتنظيم المادة الوراثية من الأصغر:": "ابدأ من أصغر مستوى وهو الجزيء الحامل للشيفرة الوراثية نفسه، وانتهِ بأعلى مستويات الإحكام وهو التركيب الذي يظهر واضحاً أثناء الانقسام.\nفي الوسط يلتف الخيط الوراثي حول بروتينات الهستون فتتكوّن وحدات متكررة تشبه الخرز، ثم تلتف وتتكاثف هذه الوحدات في ألياف. رتّب هذه المراحل من الأقل إحكاماً إلى الأكثر.", "حوّل 5 كم و600 ملم و200 سم إلى المتر.": "لا يصح جمع أطوال بوحدات مختلفة، فالخطوة الأولى توحيد الوحدات كلها إلى المتر.\nتذكّر: الكيلومتر = ألف متر، والملّيمتر جزء من ألف من المتر، والسنتيمتر جزء من مئة من المتر. حوّل كل طول على حدة، ثم اجمع الأطوال بعد أن صارت كلها بالمتر.\nانتبه: عند الانتقال من وحدة أصغر إلى المتر يصغر العدد، وعند الانتقال من الكيلومتر يكبر. أنت قادر!", "حوّل 45 سم إلى المتر.": "السنتيمتر جزء من مئة من المتر، أي أن المتر الواحد يحوي مئة سنتيمتر.\nعند التحويل من وحدة أصغر إلى وحدة أكبر نقسم على عدد الوحدات الصغيرة التي في الكبيرة. طبّق ذلك ثم تأكد أن الناتج أصغر من العدد الأصلي.", "حوّل 108 كم/س إلى م/ث.": "المطلوب تحويل وحدتين معاً: الكيلومتر إلى متر، والساعة إلى ثانية.\nتذكّر: الكيلومتر = ألف متر، والساعة = عدد معين من الثواني (ستون دقيقة، وكل دقيقة ستون ثانية). فالتحويل يعني ضرب العدد في عدد الأمتار ثم القسمة على عدد الثواني.\nاكتب خطوتي التحويل بترتيبهما ثم احسب.", "حوّل 72 كم/س إلى م/ث.": "هذا تحويل من كم/س إلى م/ث: الكيلومتر يتحول إلى أمتار، والساعة إلى ثوانٍ.\nيمكنك أن تجمع التحويلين في عامل واحد ثابت تضرب به أو تقسم عليه كلما انتقلت بين الوحدتين. استنتجه أولاً من الكيلومتر = ألف متر والساعة = 3600 ثانية، ثم طبّقه.\nتحقق أخيراً: السرعة بوحدة م/ث تأتي عددياً أصغر من السرعة بوحدة كم/س.", "كم ثانية في اليوم الواحد؟": "اسأل نفسك بالترتيب: كم ساعة في اليوم؟ وكم دقيقة في الساعة؟ وكم ثانية في الدقيقة؟\nللانتقال من وحدة كبيرة إلى صغيرة نضرب في عوامل التحويل المتتالية. اكتب العوامل الثلاثة ثم اضربها معاً.", "حوّل 3 غم/سم³ إلى كغم/م³.": "حوّل كل وحدة على حدة: الغرام إلى كيلوغرام، ثم السنتيمتر المكعب إلى متر مكعب.\nالغرام جزء من ألف من الكيلوغرام. أما حجم المتر المكعب بالسنتيمتر المكعب فهو مكعب عدد السنتيمترات في المتر، لأن الحجم له ثلاثة أبعاد.\nعوّض التحويلين في الكثافة ككسر، وانتبه أن الوحدة الموجودة في المقام تنعكس عند التحويل.", "ورنية: التدريج الرئيسي 2.4 سم، والخط المنطبق رقم 2، ودقة الورنية 0.01 سم. احسب القراءة.": "قراءة الورنية = القراءة على التدريج الرئيسي + (رقم الخط المنطبق × دقة الورنية).\nالجزء الثاني هو ما تضيفه الورنية من كسور صغيرة، فاحسبه أولاً ثم أضفه إلى قراءة التدريج الرئيسي.\nاحرص على أن تكون الوحدة واحدة في الحدين، وتحقق أن الناتج النهائي أكبر قليلاً من قراءة التدريج الرئيسي.", "ورنية: التدريج الرئيسي 3.1 سم، والخط المنطبق رقم 7، ودقة الورنية 0.01 سم. احسب القراءة.": "تذكّر قاعدة الورنية: القراءة = التدريج الرئيسي + (رقم الخط المنطبق × الدقة).\nنفّذ الضرب أولاً لتعرف ما أضافته الورنية، ثم اجمعه مع القراءة الرئيسية.\nتأكد أن الإضافة أصغر من أصغر تقسيم على التدريج الرئيسي.", "ميكرومتر: التدريج الثابت 9 ملم، والدائري 44، والدقة 0.01 ملم. احسب القراءة.": "في الميكرومتر: القراءة = التدريج الثابت + (قراءة التدريج الدائري × الدقة).\nاحسب مساهمة التدريج الدائري أولاً (عدد الأقسام × قيمة القسم الواحد)، ثم أضفها إلى قراءة التدريج الثابت.\nلاحظ أن الوحدة هنا بالملّيمتر في الحدين.", "ميكرومتر: التدريج الثابت 5.5 ملم، والدائري 28 قسماً. احسب القراءة.": "الميكرومتر المعتاد دقته جزء من مئة من الملّيمتر، أي أن كل قسم على التدريج الدائري يساوي هذه القيمة.\nثم القراءة = التدريج الثابت + (عدد الأقسام على الدائري × قيمة القسم الواحد).\nاحسب الجزء الدائري أولاً ثم اجمع.", "قياس قطر سلك بالميكرومتر: الثابت 1.5 ملم والدائري 36. ما القطر بالملم؟": "القطر يُقرأ بالميكرومتر هكذا: القراءة = التدريج الثابت + (التدريج الدائري × الدقة).\nدقة الميكرومتر المعتاد جزء من مئة من الملّيمتر. حوّل قراءة الدائري إلى ملّيمترات بضربها في الدقة، ثم أضفها إلى الثابت.\nالناتج بالملّيمتر كما طُلب، فلا حاجة لأي تحويل آخر.", "إذا كان 1 سم يمثل 10 م، فكم سنتيمتراً تمثل 100 م؟": "المقياس يخبرك كم يمثل السنتيمتر الواحد على الرسم من المسافة الحقيقية.\nلمعرفة عدد السنتيمترات اللازمة: عدد السنتيمترات = المسافة الحقيقية ÷ ما يمثله السنتيمتر الواحد.\nاحسب كم مرة يتسع ما يمثله السنتيمتر الواحد في المسافة المعطاة.", "إذا كان 1 سم يمثل 50 م، فكم سنتيمتراً تمثل 250 م؟": "في الرسم بمقياس، كل سنتيمتر يمثل مسافة حقيقية ثابتة.\nعدد سنتيمترات الرسم = المسافة الحقيقية ÷ ما يمثله السنتيمتر الواحد.\nطبّق القسمة وتأكد أن الوحدتين المقسوم والمقسوم عليه متماثلتان (متر على متر).", "رُسم متجه طوله 3 سم بمقياس 1 سم = 20 م. كم مقدار الكمية التي يمثلها بالمتر؟": "هنا نعكس العملية: نعرف طول الرسم ونريد الكمية الحقيقية.\nالكمية الحقيقية = طول الرسم بالسنتيمتر × ما يمثله السنتيمتر الواحد.\nاضرب وانتبه لوحدة الناتج، فهي وحدة الكمية التي يمثلها السنتيمتر الواحد.", "سيارة إزاحتها 120 م خلال 20 ث. ما سرعتها المتوسطة؟": "السرعة المتوسطة = الإزاحة ÷ الزمن الذي استغرقته.\nحدّد في المسألة أي القيمتين هي الإزاحة وأيهما الزمن، ثم اقسم.\nوحدة الناتج تأتي من وحدة الإزاحة مقسومة على وحدة الزمن.", "دراجة تتحرك بسرعة ثابتة 15 م/ث لمدة 8 ث. ما إزاحتها؟": "عندما تكون السرعة ثابتة فإن الإزاحة = السرعة × الزمن.\nفكّر: السرعة تعني ما يقطعه الجسم في كل ثانية، فماذا يحدث إذا استمر ذلك عدة ثوانٍ؟\nاضرب وتحقق أن الوحدة هي المتر.", "تغيرت سرعة جسم من 4 م/ث إلى 16 م/ث خلال 3 ث. ما تسارعه المتوسط؟": "التسارع المتوسط = التغير في السرعة ÷ الزمن، والتغير في السرعة = السرعة النهائية − السرعة الابتدائية.\nاحسب التغير أولاً (الأخيرة ناقص الأولى)، ثم اقسمه على الزمن.\nوحدة التسارع م/ث²: لأن السرعة تتغير بمقدار معين في كل ثانية.", "جسم يبدأ من السكون بتسارع 2 م/ث². ما سرعته بعد 6 ث؟": "معادلة السرعة بالتسارع الثابت: ع = ع₀ + ت × ز.\nاسأل نفسك: ماذا تساوي السرعة الابتدائية لجسم يبدأ من السكون؟ ثم احسب ما يضيفه التسارع في الزمن المعطى.\nعوّض بنفسك واحسب.", "جسم يتحرك على دائرة نصف قطرها 5 م، فأتم دورة كاملة. ما المسافة المقطوعة؟ (π = 3.14)": "عند إتمام دورة كاملة تكون المسافة المقطوعة مساوية لمحيط الدائرة.\nمحيط الدائرة = 2 × π × نق.\nعوّض نصف القطر وقيمة π المعطاة واحسب، ولا تخلط بين نصف القطر والقطر.", "في الدورة الكاملة على الدائرة، ما مقدار الإزاحة؟": "الإزاحة هي الفرق بين نقطة البداية ونقطة النهاية مع الاتجاه، ولا تهتم بالمسار الذي سلكه الجسم.\nبعد دورة كاملة على الدائرة، قارن موضع الجسم النهائي بموضعه عند البداية. ماذا تلاحظ؟\nمن ذلك تستنتج مقدار الإزاحة.", "ما وزن جسم كتلته 5 كغم؟ (جـ = 10 م/ث²)": "الوزن قوة جذب الأرض للجسم، ويُحسب بالقانون: الوزن = الكتلة × تسارع الجاذبية.\nوحدة الوزن النيوتن لأنه قوة، أما الكتلة فبالكيلوغرام.\nعوّض الكتلة وقيمة جـ المعطاة في القانون.", "قوة محصلة 30 نيوتن تؤثر في جسم كتلته 6 كغم. ما تسارعه؟": "قانون نيوتن الثاني: القوة المحصلة = الكتلة × التسارع.\nالمطلوب التسارع، فأعد ترتيب القانون: التسارع = القوة ÷ الكتلة.\nعوّض القيمتين واحسب، وتذكّر أن وحدة الناتج م/ث².", "جسم كتلته 4 كغم يتسارع 3 م/ث². ما القوة المحصلة المؤثرة فيه؟": "استعمل قانون نيوتن الثاني: القوة المحصلة = الكتلة × التسارع.\nالكتلة والتسارع معطيان، فلا حاجة لإعادة ترتيب القانون.\nاضرب وانتبه أن وحدة القوة النيوتن.", "ما التردد لجسم زمنه الدوري 0.5 ث؟": "التردد والزمن الدوري مقلوب أحدهما الآخر: التردد = 1 ÷ الزمن الدوري.\nالزمن الدوري هو زمن دورة واحدة، والتردد هو عدد الدورات في الثانية الواحدة، ووحدته الهرتز.\nاقسم 1 على الزمن الدوري المعطى، وتحقق: إذا كان الزمن الدوري أقل من ثانية فالتردد يزيد على 1.", "القوة المركزية لجسم كتلته 2 كغم يدور بسرعة 3 م/ث على دائرة نصف قطرها 1.5 م؟": "القوة المركزية = الكتلة × مربع السرعة ÷ نصف القطر.\nانتبه إلى التربيع: يقع على السرعة وحدها، فربّعها أولاً ثم اضرب في الكتلة، وأخيراً اقسم على نصف القطر.\nنفّذ الخطوات بالترتيب، ووحدة الناتج نيوتن.", "الزمن الدوري لجسم يدور بسرعة 4 م/ث على دائرة نصف قطرها 2 م؟ (π = 3.14)": "الزمن الدوري هو زمن دورة كاملة واحدة، والجسم يقطع في الدورة الواحدة محيط الدائرة.\nتذكّر أن المحيط = 2π نق، وأن الزمن = المسافة ÷ السرعة، فاجمع الفكرتين في قانون واحد للزمن الدوري ن بدلالة نق وع.\nعوّض بالقيم المعطاة (وانتبه لقيمة π المطلوبة) ثم احسب. أنت قادر!", "قوة عمودية 200 نيوتن على مساحة 0.5 م². ما الضغط؟": "الضغط يقيس مقدار القوة العمودية الواقعة على كل وحدة مساحة: الضغط = القوة ÷ المساحة.\nتأكد أن وحدتي القوة والمساحة هما النيوتن والمتر المربع، فتكون وحدة الناتج الباسكال.\nعوّض واقسم بحذر، فالقسمة على عدد أصغر من الواحد تعطي ناتجاً أكبر.", "ما الضغط الناتج عن عمود ماء ارتفاعه 3 م؟ (ث = 1000 كغم/م³، جـ = 10)": "ضغط عمود السائل لا يتوقف على شكل الوعاء، بل على كثافة السائل وعمق النقطة وتسارع الجاذبية: ض = ث × ل × جـ.\nالمطلوب هنا الضغط الناتج عن العمود وحده، فلا تضف إليه ضغط الهواء.\nعوّض القيم المعطاة بوحداتها (كغم/م³ ثم م ثم م/ث²) واضرب، وستحصل على الباسكال.", "ما كثافة جسم كتلته 2 كغم وحجمه 0.001 م³؟": "الكثافة تعبّر عن مقدار الكتلة الموجودة في وحدة الحجم: الكثافة = الكتلة ÷ الحجم.\nتحقق أن الكتلة بالكيلوغرام والحجم بالمتر المكعب، فتأتي الكثافة بوحدة كغم/م³.\nاقسم بعناية، وانتبه لمنزلة الفاصلة العشرية في الحجم.", "مكبس هيدروليكي: أ₁ = 0.02 م²، أ₂ = 0.4 م²، ق₁ = 50 نيوتن. ما ق₂؟": "مبدأ باسكال: الضغط المنتقل في سائل محبوس ينتقل كاملاً إلى جميع أجزائه، فالضغط عند المكبس الأول يساوي الضغط عند المكبس الثاني.\nوبما أن الضغط = القوة ÷ المساحة فإن ق₁ ÷ أ₁ = ق₂ ÷ أ₂.\nأعد ترتيب العلاقة لتعزل ق₂ ثم عوّض بالقيم. ما الذي يحدث للقوة حين تكبر المساحة؟ فكّر في ذلك لتتأكد من منطقية ناتجك.", "تفاعل 12 غم كربون مع 32 غم أكسجين. ما كتلة CO₂ الناتج؟": "قانون حفظ الكتلة: مجموع كتل المتفاعلات يساوي مجموع كتل النواتج، فالمادة لا تفنى ولا تُستحدث في التفاعل الكيميائي.\nهنا تفاعلت مادتان وناتج التفاعل مادة واحدة، فكتلتها تساوي مجموع كتلتي المتفاعلين.\nاجمع الكتلتين واكتب الناتج بالغرام.", "تفاعل 32 غم ميثان مع أكسجين فنتج 44 غم CO₂ و18 غم ماء. ما كتلة الأكسجين المستهلكة؟": "نطبق قانون حفظ الكتلة: كتلة المتفاعلات كلها = كتلة النواتج كلها.\nاجمع كتل النواتج المعطاة، واجمع كتل المتفاعلات (المجهول هو كتلة الأكسجين المستهلكة)، ثم ساوِ بين المجموعين.\nحلّ المعادلة لتجد المجهول. ستنجح!", "ما النسبة المئوية الكتلية للهيدروجين في الماء H₂O؟ (H = 1، O = 16)": "النسبة المئوية الكتلية للعنصر = (كتلة العنصر في الصيغة ÷ الكتلة الكلية للمركب) × 100.\nاحسب أولاً الكتلة المولية للمركب بجمع كتل الذرات كلها، وانتبه للرقم الصغير أسفل الرمز فهو عدد ذرات العنصر.\nثم خذ كتلة ذرات الهيدروجين وحدها في الصيغة واقسمها على الكتلة الكلية واضرب في مئة.", "ما النسبة المئوية الكتلية للأكسجين في الماء H₂O؟": "النسبة المئوية الكتلية للعنصر = (كتلة العنصر في الصيغة ÷ الكتلة الكلية للمركب) × 100.\nاحسب الكتلة المولية للماء من كتل ذراته (راجع الجدول الدوري لكتلتي H وO)، ثم خذ كتلة ذرة الأكسجين وحدها.\nفكّر: إذا عرفت نسبة الهيدروجين في الماء فكم يجب أن يكون مجموع النسبتين؟ استعمل ذلك للتحقق من إجابتك.", "ما النسبة المئوية الكتلية للنيتروجين في الأمونيا NH₃؟ (N = 14، H = 1)": "النسبة المئوية الكتلية للعنصر = (كتلة العنصر في الصيغة ÷ الكتلة الكلية للمركب) × 100.\nاجمع كتل الذرات في NH₃ مراعياً الرقم الصغير بعد H فهو يضاعف كتلة الهيدروجين، ثم خذ كتلة النيتروجين فقط.\nاقسم واضرب في مئة، وقرّب الناتج إلى منزلة عشرية واحدة.", "في عينات سكر: نسبة الكربون 42% والهيدروجين 6.5%. ما نسبة الأكسجين؟": "مجموع النسب المئوية لجميع العناصر في المركب النقي يساوي 100%.\nما دام السكر مكوناً من الكربون والهيدروجين والأكسجين فقط، فنسبة الأكسجين هي ما تبقّى بعد طرح النسبتين المعلومتين من 100.\nاجمع النسبتين أولاً ثم اطرحهما من المئة.", "ما الكتلة المولية لثاني أكسيد الكربون CO₂؟ (C = 12، O = 16)": "الكتلة المولية للمركب هي مجموع الكتل الذرية لكل الذرات في صيغته، وتُقاس بوحدة غم/مول.\nانظر إلى الرقم الصغير أسفل رمز كل عنصر في CO₂ فهو يخبرك كم ذرة منه في الجزيء.\nاضرب كتلة كل عنصر في عدد ذراته ثم اجمع.", "كم مولاً في 36 غم من الماء؟ (الكتلة المولية 18 غم/مول)": "عدد الموالت = الكتلة ÷ الكتلة المولية.\nالكتلة المولية معطاة لك، فلا تحتاج إلا إلى القسمة، وتحقق أن وحدة الغرام تُختصر فيبقى الناتج بوحدة المول.\nعوّض وأوجد عدد الموالت.", "ما كتلة 0.5 مول من CaCO₃؟ (الكتلة المولية 100 غم/مول)": "الكتلة = عدد الموالت × الكتلة المولية، وهي إعادة ترتيب لقانون عدد الموالت.\nتأكد أن وحدة مول تُختصر مع مول في المقام فيبقى الغرام.\nعوّض القيمتين المعطاتين واضرب.", "ما حجم 2 مول من غاز عند الظروف المعيارية STP؟": "عند الظروف المعيارية STP يشغل المول الواحد من أي غاز حجماً ثابتاً هو 22.4 لتراً.\nإذن الحجم = عدد الموالت × حجم المول الواحد.\nاضرب عدد الموالت المعطى في هذا الحجم ثم اكتب الوحدة باللتر.", "كم ذرة في 0.25 مول من الحديد؟ (أعطِ الناتج بوحدة ×10²³ ذرة)": "المول الواحد من أي مادة يحتوي على عدد أفوجادرو من الجسيمات، وهو يساوي تقريباً 6.02 × 10²³.\nعدد الذرات = عدد الموالت × عدد أفوجادرو.\nاضرب العدد العشري في 6.02 وأبقِ القوة 10²³ كما هي، وقرّب الناتج كما يطلب السؤال.", "ما كتلة 11.2 لتر من غاز O₂ عند STP؟ (O = 16)": "الكتلة لا تُحسب من الحجم مباشرة، فالجسر بينهما هو المول: حجم الغاز ← عدد الموالت ← الكتلة.\nأولاً: عدد الموالت = الحجم ÷ 22.4 عند STP. ثانياً: الكتلة = الموالت × الكتلة المولية.\nانتبه أن الأكسجين الغازي جزيء ثنائي الذرة O₂، فكتلته المولية ضعف كتلة ذرة O.", "في التفاعل 5O₂ + 4NH₃ → 4NO + 6H₂O: كم مولاً من NO يتكون من 2 مول NH₃؟": "معاملات المعادلة الموزونة تعبّر عن النسبة بين الموالت: عدد موالت المادة الأولى إلى عدد موالت الثانية يساوي النسبة بين معاملَيهما.\nحدّد معامل NH₃ ومعامل NO في المعادلة، وكوّن النسبة بينهما.\nثم اضرب عدد الموالت المعلوم في النسبة (معامل المطلوب ÷ معامل المعلوم).", "2H₂ + O₂ → 2H₂O: ما كتلة الماء الناتجة من 4 غم H₂؟ (H₂ = 2، H₂O = 18)": "المسألة تتطلب المرور بالمول: الكتلة المعلومة ← موالت H₂ ← موالت H₂O ← كتلة H₂O.\nحوّل الكتلة إلى موالت بالقسمة على الكتلة المولية، ثم استعمل معاملَي H₂ وH₂O في المعادلة الموزونة لإيجاد موالت الماء.\nأخيراً حوّل الموالت إلى كتلة بالضرب في الكتلة المولية للماء.", "N₂ + 3H₂ → 2NH₃: ما حجم NH₃ الناتج من 10 لتر N₂ (نفس الظروف)؟": "للغازات في الظروف نفسها من ضغط ودرجة حرارة تكون نسبة الحجوم مساوية لنسبة الموالت، أي لنسبة المعاملات في المعادلة الموزونة.\nحدّد معاملي N₂ وNH₃ وكوّن منهما النسبة.\nاضرب الحجم المعلوم في (معامل المطلوب ÷ معامل المعلوم). لا حاجة هنا إلى تحويل الحجم إلى موالت.", "CaCO₃ → CaO + CO₂: ما كتلة CO₂ الناتجة من تحلل 50 غم CaCO₃؟ (CaCO₃ = 100، CO₂ = 44)": "هذه مسألة كتلة ← كتلة، ولا يمكن الانتقال من مادة لأخرى إلا عبر المول.\nالخطوات: موالت CaCO₃ = الكتلة ÷ الكتلة المولية، ثم استعمل نسبة المعاملات بين CaCO₃ وCO₂ في المعادلة، ثم الكتلة = الموالت × الكتلة المولية لـ CO₂.\nلاحظ المعاملين في المعادلة قبل أن تبدأ.", "5O₂ + 4NH₃ → 4NO + 6H₂O: ما كتلة O₂ اللازمة لتفاعل 17 غم NH₃؟ (NH₃ = 17، O₂ = 32)": "هذه مسألة كتلة ← كتلة، والجسر بين المادتين هو المول.\nحوّل كتلة NH₃ إلى موالت بالقسمة على كتلته المولية، ثم اضرب في نسبة معاملي O₂ وNH₃ من المعادلة الموزونة (معامل المطلوب ÷ معامل المعلوم)، ثم حوّل موالت O₂ إلى كتلة بالضرب في كتلته المولية.\nانتبه ألا تعكس النسبة. أحسنت التفكير!", "محتوى النواتج الحراري −300 كيلوجول والمتفاعلات −100. احسب ΔH.": "التغير في المحتوى الحراري: ΔH = H(النواتج) − H(المتفاعلات).\nالإشارة تدل على نوع التفاعل: إن كانت ΔH سالبة فالتفاعل طارد للحرارة، وإن كانت موجبة فهو ماص.\nانتبه عند طرح عدد سالب فهو يتحول إلى جمع، ثم احسب.", "محتوى النواتج 150 كيلوجول والمتفاعلات 90. احسب ΔH.": "التغير في المحتوى الحراري: ΔH = H(النواتج) − H(المتفاعلات).\nاطرح بالترتيب الصحيح، النواتج أولاً ثم المتفاعلات، ولا تعكسه.\nبعد الحساب انظر إلى إشارة الناتج: الموجبة تعني تفاعلاً ماصاً والسالبة تعني تفاعلاً طارداً للحرارة."};
